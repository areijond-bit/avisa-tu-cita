<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Avisa tu Cita</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;700;800&family=Atkinson+Hyperlegible+Mono:wght@500;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
/* Layout: encabezado blanco con línea azul; una columna angosta para el paciente con una sola acción por pantalla; el consultorio ve una lista por hora. Siempre fondo blanco. */
:root {
  --white: #FFFFFF;
  --ink: #0F1B2D;
  --muted: #4E5D75;
  --line: #DDE4EE;
  --soft: #F5F8FC;
  --blue: #1450A3;
  --blue-hover: #0F428A;
  --blue-tint: #EAF1FB;
  --orange: #E2650F;
  --orange-ink: #B24F0B;
  --orange-tint: #FFF1E6;
  --error: #B42318;
  --font: "Atkinson Hyperlegible Next", "Segoe UI", system-ui, sans-serif;
  --mono: "Atkinson Hyperlegible Mono", ui-monospace, Consolas, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { background: var(--white); }
body { background: var(--white); color: var(--ink); font-family: var(--font); font-size: 20px; line-height: 1.5; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--orange); outline-offset: 3px; }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { text-wrap: balance; line-height: 1.2; }
svg.i { width: 1em; height: 1em; flex: none; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

.wrap { width: 100%; max-width: 560px; margin: 0 auto; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
.wrap.wide { max-width: 1000px; }

/* encabezado */
.top { border-bottom: 4px solid var(--blue); background: var(--white); }
.top .wrap { display: flex; align-items: center; gap: 14px; padding-block: 16px; }
.mark { width: 48px; height: 48px; border-radius: 12px; background: var(--blue); display: grid; place-items: center; flex: none; }
.mark svg { width: 26px; height: 26px; }
.top .id { display: flex; flex-direction: column; min-width: 0; }
.top .doc { font-size: 22px; font-weight: 800; line-height: 1.2; }
.top .place { font-size: 16px; color: var(--muted); }
.top .right { margin-left: auto; }

main.wrap { padding-block: 28px 24px; display: flex; flex-direction: column; gap: 24px; }

/* botones grandes */
.btn-xl {
  display: flex; align-items: center; justify-content: center; gap: 14px;
  width: 100%; min-height: 80px; padding: 16px 24px; border-radius: 16px;
  font-size: 26px; font-weight: 800; letter-spacing: 0.005em; border: 3px solid transparent;
  transition: background-color .15s, transform .05s;
}
.btn-xl svg.i { width: 32px; height: 32px; stroke-width: 2.6; }
.btn-xl:active { transform: translateY(1px); }
.btn-blue { background: var(--blue); color: var(--white); }
.btn-blue:hover { background: var(--blue-hover); }
.btn-orange { background: var(--orange); color: var(--white); }
.btn-orange:hover { background: var(--orange-ink); }
.btn-orange-line { background: var(--white); color: var(--orange-ink); border-color: var(--orange); }
.btn-orange-line:hover { background: var(--orange-tint); }
.btn-plain { background: var(--white); color: var(--blue); border-color: var(--line); font-size: 22px; min-height: 64px; }
.btn-plain:hover { border-color: var(--blue); }

.lead { display: flex; flex-direction: column; gap: 10px; }
.lead h1 { font-size: 34px; font-weight: 800; }
.lead p { font-size: 21px; color: var(--muted); max-width: 32ch; }
.step { font-size: 16px; font-weight: 700; color: var(--orange-ink); letter-spacing: 0.06em; text-transform: uppercase; }

/* teléfono */
.phone { display: flex; align-items: center; gap: 16px; padding: 18px 20px; border: 2px solid var(--line); border-radius: 16px; }
.phone .ic { width: 52px; height: 52px; border-radius: 50%; background: var(--blue-tint); color: var(--blue); display: grid; place-items: center; flex: none; }
.phone .ic svg.i { width: 26px; height: 26px; }
.phone .txt { display: flex; flex-direction: column; min-width: 0; }
.phone .txt span { font-size: 17px; color: var(--muted); }
.phone a { font-family: var(--mono); font-size: 24px; font-weight: 700; color: var(--blue); text-decoration: none; user-select: all; }

/* formulario */
form.stack, .stack { display: flex; flex-direction: column; gap: 22px; }
.field { display: flex; flex-direction: column; gap: 8px; }
.field label { font-size: 22px; font-weight: 700; }
.field .help { font-size: 17px; color: var(--muted); margin-top: -4px; }
.input { width: 100%; min-height: 66px; padding: 12px 18px; font-size: 26px; border: 2px solid #B9C5D6; border-radius: 14px; background: var(--white); }
.input:focus { border-color: var(--blue); outline: 3px solid var(--blue-tint); outline-offset: 0; }
.input.digits { font-family: var(--mono); letter-spacing: 0.35em; max-width: 240px; }
.err { display: flex; gap: 10px; align-items: flex-start; color: var(--error); font-weight: 700; font-size: 19px; background: #FDECEA; border-radius: 12px; padding: 14px 16px; }
.tip { font-size: 16px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 14px; }

/* cita */
.appt { border: 2px solid var(--blue); border-radius: 18px; overflow: hidden; }
.appt .who { background: var(--blue); color: var(--white); padding: 14px 20px; font-size: 20px; font-weight: 700; }
.appt .body { padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.appt .line { display: flex; align-items: center; gap: 14px; }
.appt .line svg.i { width: 30px; height: 30px; color: var(--blue); }
.appt .date { font-size: 24px; font-weight: 700; }
.appt .time { font-size: 40px; white-space: nowrap; font-variant-numeric: tabular-nums; font-weight: 700; color: var(--blue); line-height: 1.1; }
.state { display: flex; align-items: center; gap: 10px; font-size: 19px; font-weight: 700; padding: 12px 16px; border-radius: 12px; }
.state svg.i { width: 24px; height: 24px; }
.state.camino { background: var(--blue-tint); color: var(--blue); }
.state.no_va { background: var(--orange-tint); color: var(--orange-ink); }
.state.llego { background: var(--soft); color: var(--ink); }
.actions { display: flex; flex-direction: column; gap: 14px; }
.note { font-size: 18px; color: var(--muted); }

/* confirmación */
.done { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 16px; padding-block: 12px; }
.done .ok { width: 104px; height: 104px; border-radius: 50%; display: grid; place-items: center; }
.done .ok svg.i { width: 56px; height: 56px; stroke-width: 3; }
.done .ok.blue { background: var(--blue); color: var(--white); }
.done .ok.orange { background: var(--orange); color: var(--white); }
.done h1 { font-size: 34px; font-weight: 800; }
.done p { font-size: 22px; color: var(--muted); max-width: 26ch; }

.foot { border-top: 1px solid var(--line); margin-top: 8px; }
.foot .wrap { padding-block: 18px 28px; display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center; justify-content: space-between; font-size: 15px; color: var(--muted); }
.link { background: none; border: 0; padding: 4px 0; color: var(--blue); font-weight: 700; font-size: 15px; text-decoration: underline; text-underline-offset: 3px; }

/* ---------- consultorio ---------- */
.nav { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.nav button { background: none; border: 0; border-bottom: 3px solid transparent; margin-bottom: -1px; padding: 12px 16px; font-size: 17px; font-weight: 700; color: var(--muted); white-space: nowrap; }
.nav button[aria-selected="true"] { color: var(--blue); border-bottom-color: var(--orange); }
.admin { display: flex; flex-direction: column; gap: 22px; }
.bar { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; justify-content: space-between; }
.bar h2 { font-size: 26px; font-weight: 800; }
.bar .sub { font-size: 16px; color: var(--muted); }
.date-in { padding: 10px 12px; border: 2px solid var(--line); border-radius: 10px; font-size: 16px; background: var(--white); }

.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: 14px; }
.stat { padding: 14px 18px; display: flex; flex-direction: column; gap: 2px; border-left: 1px solid var(--line); }
.stat:first-child { border-left: 0; }
.stat b { font-family: var(--mono); font-size: 32px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat span { font-size: 15px; font-weight: 700; color: var(--muted); }
.stat.camino b { color: var(--blue); }
.stat.no_va b { color: var(--orange-ink); }
.stat.pendiente b { color: var(--muted); }
.stat.llego b { color: var(--ink); }
@media (max-width: 600px) {
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .stat:nth-child(3) { border-left: 0; }
  .stat:nth-child(n+3) { border-top: 1px solid var(--line); }
}

.list { border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.row { display: grid; grid-template-columns: 72px minmax(0, 1fr) auto; gap: 4px 16px; align-items: center; padding: 14px 18px; border-top: 1px solid var(--line); font-size: 18px; }
.row:first-child { border-top: 0; }
.row.now { background: var(--soft); }
.row .hr { font-family: var(--mono); font-weight: 700; font-size: 19px; font-variant-numeric: tabular-nums; color: var(--blue); }
.row .name { font-weight: 700; overflow-wrap: anywhere; }
.row .meta { font-size: 15px; color: var(--muted); font-family: var(--mono); }
.row.no_va .name { text-decoration: line-through; text-decoration-color: var(--orange); color: var(--muted); }
.row .right { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: flex-end; }
.tag { display: inline-flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 700; padding: 6px 12px; border-radius: 999px; white-space: nowrap; }
.tag::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: currentColor; }
.tag.camino { background: var(--blue-tint); color: var(--blue); }
.tag.no_va { background: var(--orange-tint); color: var(--orange-ink); }
.tag.pendiente { background: var(--soft); color: var(--muted); }
.tag.llego { background: var(--ink); color: var(--white); }
.tag.late { background: var(--white); color: var(--orange-ink); box-shadow: inset 0 0 0 2px var(--orange); }
.sbtn { border: 2px solid var(--blue); background: var(--white); color: var(--blue); border-radius: 10px; padding: 7px 14px; font-size: 15px; font-weight: 700; }
.sbtn:hover { background: var(--blue-tint); }
.sbtn.fill { background: var(--blue); color: var(--white); }
.sbtn.fill:hover { background: var(--blue-hover); }
.sbtn.ghost { border-color: var(--line); color: var(--muted); }
@media (max-width: 600px) {
  .row { grid-template-columns: 60px minmax(0, 1fr); }
  .row .right { grid-column: 2; justify-content: flex-start; }
}
.empty { padding: 32px 18px; text-align: center; color: var(--muted); font-size: 18px; }

.paste textarea { width: 100%; min-height: 220px; padding: 14px; border: 2px solid var(--line); border-radius: 12px; font-family: var(--mono); font-size: 15px; line-height: 1.6; background: var(--white); }
.paste textarea:focus { border-color: var(--blue); outline: none; }
.paste .help { font-size: 17px; color: var(--muted); max-width: 70ch; }
.tbl { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; }
table { border-collapse: collapse; width: 100%; font-size: 16px; }
th, td { padding: 10px 14px; text-align: left; border-top: 1px solid var(--line); white-space: nowrap; }
th { border-top: 0; background: var(--soft); font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
td.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
tr.bad td { color: var(--error); background: #FDECEA; }
.row-btns { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.mbtn { border: 0; border-radius: 12px; padding: 12px 22px; font-size: 17px; font-weight: 700; background: var(--blue); color: var(--white); }
.mbtn:hover { background: var(--blue-hover); }
.mbtn.orange { background: var(--orange); }
.mbtn.orange:hover { background: var(--orange-ink); }
.mbtn.line { background: var(--white); color: var(--blue); border: 2px solid var(--line); }
.mbtn:disabled { opacity: .45; cursor: not-allowed; }
.okmsg { color: var(--blue); font-weight: 700; }

.poster { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 32px; align-items: center; border: 2px solid var(--blue); border-radius: 18px; padding: 32px; }
.poster .eyebrow { color: var(--orange-ink); font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; font-size: 15px; }
.poster h2 { font-size: 36px; font-weight: 800; color: var(--blue); margin-top: 6px; }
.poster ol { margin: 18px 0 0; padding-left: 26px; font-size: 20px; display: flex; flex-direction: column; gap: 6px; }
.poster .small { font-size: 15px; color: var(--muted); margin-top: 18px; }
.qrbox { padding: 14px; border: 2px solid var(--line); border-radius: 14px; background: var(--white); }
.qrbox img, .qrbox canvas { display: block; width: 200px; height: 200px; }
@media (max-width: 600px) { .poster { grid-template-columns: 1fr; padding: 22px; } }

.lock { max-width: 420px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div id="app"></div>

<script>
(function () {
  const KEY = "avisa-cita-demo-v2";
  // Horario de consulta: de 8:00 a 14:00, una cita cada 15 minutos (24 lugares)
  const HORARIO = { inicio: 8 * 60, fin: 14 * 60, cada: 15 };
  const SLOTS = [];
  for (let m = HORARIO.inicio; m < HORARIO.fin; m += HORARIO.cada) SLOTS.push(String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0"));
  const CLINIC = { doctor: "Dr. Alejandro Alba", lugar: "Medicina Familiar · Consultorio 8", tel: "55 1234 5678" };
  const PIN = "1234";

  // ---------- íconos ----------
  const ICON = {
    search: '<circle cx="11" cy="11" r="7.5"/><line x1="21" y1="21" x2="16.4" y2="16.4"/>',
    go: '<polygon points="3 11 21 3 13 21 11 13 3 11"/>',
    x: '<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>',
    check: '<polyline points="20 6 9 17 4 12"/>',
    back: '<line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>',
    cal: '<rect x="3" y="4.5" width="18" height="17" rx="2.5"/><line x1="16" y1="2.5" x2="16" y2="6.5"/><line x1="8" y1="2.5" x2="8" y2="6.5"/><line x1="3" y1="10" x2="21" y2="10"/>',
    clock: '<circle cx="12" cy="12" r="9.5"/><polyline points="12 7 12 12 15.5 14"/>',
    phone: '<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.9.6 2.8.7a2 2 0 0 1 1.7 2z"/>',
    alert: '<circle cx="12" cy="12" r="9.5"/><line x1="12" y1="7.5" x2="12" y2="12.5"/><line x1="12" y1="16.5" x2="12" y2="16.5"/>'
  };
  const ic = n => '<svg class="i" viewBox="0 0 24 24" aria-hidden="true">' + ICON[n] + '</svg>';
  const CROSS = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 3h5v6.5H21v5h-6.5V21h-5v-6.5H3v-5h6.5z" fill="#fff"/></svg>';

  // ---------- fechas ----------
  const pad = n => String(n).padStart(2, "0");
  const ymd = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  const fromYmd = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
  const today = () => ymd(new Date());
  const addDays = (s, n) => { const d = fromYmd(s); d.setDate(d.getDate() + n); return ymd(d); };
  const longDay = s => {
    const t = fromYmd(s).toLocaleDateString("es-MX", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
    return t.charAt(0).toUpperCase() + t.slice(1);
  };
  const ampm = hhmm => {
    const [h, m] = hhmm.split(":").map(Number);
    return (h % 12 === 0 ? 12 : h % 12) + ":" + pad(m) + " " + (h < 12 ? "a. m." : "p. m.");
  };
  const clock = iso => { const d = new Date(iso); return pad(d.getHours()) + ":" + pad(d.getMinutes()); };
  const nowHHMM = () => { const d = new Date(); return pad(d.getHours()) + ":" + pad(d.getMinutes()); };

  // ---------- datos de ejemplo ----------
  function sample() {
    const t = today(), m = addDays(t, 1);
    const ago = min => new Date(Date.now() - min * 60000).toISOString();
    const hoy = [
      ["Rosa María Hernández Cruz", "43987612821", "llego", ago(130)],
      ["José Luis Martínez Pérez", "11856703347", "camino", ago(15)],
      ["María Elena López Torres", "62907514821", "pendiente", null],
      ["Francisco Javier Gómez Ruiz", "30816402955", "no_va", ago(240)],
      ["Guadalupe Sánchez Rivera", "75887109163", "camino", ago(6)],
      ["Antonio Flores Mendoza", "29846801472", "pendiente", null],
      ["Carmen Ortiz Vargas", "51896207738", "pendiente", null],
      ["Manuel Castillo Reyes", "84926305519", "pendiente", null],
      ["Juana Ramírez Aguilar", "20857306611", "camino", ago(40)],
      ["Pedro Navarro Salinas", "67897005284", "pendiente", null],
      ["Leticia Domínguez Ríos", "38866209902", "pendiente", null],
      ["Alfonso Medina Rojas", "55917403376", "no_va", ago(90)],
      ["Silvia Guerrero Peña", "71886508140", "pendiente", null],
      ["Raúl Cortés Fuentes", "13897102265", "pendiente", null],
      ["Martha Alicia Ríos León", "46906801593", "pendiente", null],
      ["Héctor Vázquez Ibarra", "82877604418", "pendiente", null],
      ["Josefina Campos Luna", "24896307027", "camino", ago(3)],
      ["Ernesto Silva Montes", "59846905631", "pendiente", null],
      ["Dolores Estrada Cano", "36917208854", "pendiente", null],
      ["Jorge Alberto Rosas Soto", "90866504769", "pendiente", null],
      ["Yolanda Mejía Paredes", "17887901382", "pendiente", null],
      ["Salvador Ochoa Bravo", "63906602917", "pendiente", null],
      ["Irma Contreras Vega", "48857409046", "pendiente", null],
      ["Arturo Pineda Lara", "75897103558", "pendiente", null]
    ];
    const manana = ["Teresa Morales Jiménez", "Roberto Díaz Herrera", "Gloria Andrade Serrano", "Ramón Juárez Olvera"];
    const rows = hoy.map((r, i) => [t, SLOTS[i], ...r])
      .concat(manana.map((n, i) => [m, SLOTS[i], n, "1689740" + (1204 + i * 1111), "pendiente", null]));
    return rows.map(([fecha, hora, nombre, nss, estado, avisoEn]) => ({ id: fecha + "|" + hora + "|" + nss, fecha, hora, nombre, nss, estado, avisoEn }));
  }
  let mem = null;
  function load() {
    try { const raw = localStorage.getItem(KEY); if (raw) return JSON.parse(raw); } catch (e) {}
    if (!mem) mem = { citas: sample() };
    return mem;
  }
  function save(db) { mem = db; try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) {} }
  function setEstado(id, estado) {
    const db = load(); const c = db.citas.find(x => x.id === id); if (!c) return;
    c.estado = estado; c.avisoEn = new Date().toISOString(); save(db);
  }

  const norm = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().trim();
  const esc = s => String(s).replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
  const app = document.getElementById("app");
  const $ = id => document.getElementById(id);
  const on = (id, fn) => { const el = $(id); if (el) el.addEventListener("click", fn); };

  function topBar(right) {
    return '<header class="top"><div class="wrap' + (view === "adm" ? " wide" : "") + '"><div class="mark">' + CROSS + '</div>' +
      '<div class="id"><span class="doc">' + CLINIC.doctor + '</span><span class="place">' + CLINIC.lugar + '</span></div>' +
      (right ? '<div class="right">' + right + '</div>' : '') + '</div></header>';
  }
  function phoneBlock() {
    return '<div class="phone"><div class="ic">' + ic("phone") + '</div><div class="txt"><span>¿Tiene dudas? Llame al consultorio</span>' +
      '<a href="tel:+52' + CLINIC.tel.replace(/\s/g, "") + '">' + CLINIC.tel + '</a></div></div>';
  }

  // ---------- paciente ----------
  const fresh = () => ({ step: "inicio", q: "", d4: "", found: [], sel: null, err: "" });
  let pac = fresh();

  function renderPatient() {
    let h = topBar("") + '<main class="wrap">';
    if (pac.step === "inicio") {
      h += '<div class="lead"><h1>¿Va a venir a su cita?</h1><p>Avísele al doctor si ya va en camino o si ya no puede venir.</p></div>' +
        '<button class="btn-xl btn-blue" id="go-search" type="button">' + ic("search") + 'Buscar mi cita</button>' + phoneBlock();
    } else if (pac.step === "buscar") {
      h += '<div class="lead"><span class="step">Paso 1 de 2</span><h1>Buscar mi cita</h1></div>' +
        '<form class="stack" id="f-search" novalidate>' +
        '<div class="field"><label for="q">Su nombre</label><span class="help">Nombre y apellido, como en su carnet</span>' +
        '<input class="input" id="q" autocomplete="name" autocapitalize="words" value="' + esc(pac.q) + '"></div>' +
        '<div class="field"><label for="d4">Últimos 4 números de su seguro social</label><span class="help">Los encuentra en su carnet del IMSS</span>' +
        '<input class="input digits" id="d4" inputmode="numeric" maxlength="4" autocomplete="off" value="' + esc(pac.d4) + '"></div>' +
        (pac.err ? '<div class="err" role="alert">' + ic("alert") + '<span>' + pac.err + '</span></div>' : '') +
        '<button class="btn-xl btn-blue" type="submit">' + ic("search") + 'Buscar</button>' +
        '<button class="btn-xl btn-plain" type="button" id="back">' + ic("back") + 'Regresar</button>' +
        '<p class="tip">Prueba: escriba <b>María López</b> y <b>4821</b>.</p></form>';
    } else if (pac.step === "cita") {
      const db = load();
      const list = pac.found.map(id => db.citas.find(c => c.id === id)).filter(Boolean);
      h += '<div class="lead"><span class="step">Paso 2 de 2</span><h1>' + (list.length > 1 ? "Sus citas" : "Su cita") + '</h1></div>';
      list.forEach(c => {
        h += '<section class="appt"><div class="who">' + esc(c.nombre) + '</div><div class="body">' +
          '<div class="line">' + ic("cal") + '<span class="date">' + longDay(c.fecha) + '</span></div>' +
          '<div class="line">' + ic("clock") + '<span class="time">' + ampm(c.hora) + '</span></div>';
        if (c.estado === "camino") h += '<div class="state camino">' + ic("check") + 'Ya avisó que va en camino</div>';
        if (c.estado === "no_va") h += '<div class="state no_va">' + ic("x") + 'Ya avisó que no va a venir</div>';
        if (c.estado === "llego") h += '<div class="state llego">' + ic("check") + 'Ya está registrada su llegada</div>';
        h += '</div></section>';
        if (c.estado !== "llego") {
          h += '<div class="actions">';
          if (c.estado !== "camino") h += '<button class="btn-xl btn-blue" type="button" data-camino="' + esc(c.id) + '">' + ic("go") + 'Voy en camino</button>';
          if (c.estado !== "no_va") h += '<button class="btn-xl btn-orange-line" type="button" data-nova="' + esc(c.id) + '">' + ic("x") + 'Ya no voy a ir</button>';
          h += '</div>';
        }
      });
      h += '<button class="btn-xl btn-plain" type="button" id="restart">' + ic("back") + 'Salir</button>';
    } else if (pac.step === "confirmar_no") {
      const c = load().citas.find(x => x.id === pac.sel);
      h += '<div class="lead"><h1>¿Seguro que ya no va a venir?</h1><p>Su cita del ' + longDay(c.fecha).toLowerCase() + ' a las ' + ampm(c.hora) + ' se le dará a otro paciente.</p></div>' +
        '<div class="actions"><button class="btn-xl btn-orange" type="button" id="yes-no">' + ic("check") + 'Sí, ya no voy</button>' +
        '<button class="btn-xl btn-plain" type="button" id="cancel-no">' + ic("back") + 'No, regresar</button></div>';
    } else if (pac.step === "listo") {
      const c = load().citas.find(x => x.id === pac.sel);
      const camino = c.estado === "camino";
      h += '<div class="done"><div class="ok ' + (camino ? "blue" : "orange") + '">' + ic("check") + '</div>' +
        '<h1>Listo, ya le avisamos al doctor</h1>' +
        '<p>' + (camino ? "Le esperan a las " + ampm(c.hora) + ". Que tenga buen viaje." : "Gracias por avisar. Si necesita otra cita, llame al consultorio.") + '</p></div>' +
        '<button class="btn-xl btn-plain" type="button" id="restart">Terminar</button>' + phoneBlock();
    }
    h += '</main><footer class="foot"><div class="wrap"><span>Versión de prueba con citas de ejemplo.</span><button class="link" type="button" id="to-adm">Entrar como consultorio</button></div></footer>';
    app.innerHTML = h;
    window.scrollTo(0, 0);
    wirePatient();
  }

  function wirePatient() {
    on("to-adm", () => go("adm"));
    on("go-search", () => { pac.step = "buscar"; renderPatient(); $("q").focus(); });
    on("back", () => { pac = fresh(); renderPatient(); });
    on("restart", () => { pac = fresh(); renderPatient(); });
    on("cancel-no", () => { pac.step = "cita"; renderPatient(); });
    on("yes-no", () => { setEstado(pac.sel, "no_va"); pac.step = "listo"; renderPatient(); });
    app.querySelectorAll("[data-camino]").forEach(b => b.addEventListener("click", () => { pac.sel = b.dataset.camino; setEstado(pac.sel, "camino"); pac.step = "listo"; renderPatient(); }));
    app.querySelectorAll("[data-nova]").forEach(b => b.addEventListener("click", () => { pac.sel = b.dataset.nova; pac.step = "confirmar_no"; renderPatient(); }));
    const f = $("f-search");
    if (!f) return;
    $("d4").addEventListener("input", e => { e.target.value = e.target.value.replace(/\D/g, "").slice(0, 4); });
    f.addEventListener("submit", e => {
      e.preventDefault();
      pac.q = $("q").value; pac.d4 = $("d4").value;
      const words = norm(pac.q).split(/\s+/).filter(w => w.length >= 2);
      if (!words.length) { pac.err = "Escriba su nombre."; return renderPatient(); }
      if (pac.d4.length !== 4) { pac.err = "Escriba los 4 números de su seguro social."; return renderPatient(); }
      const t = today();
      const found = load().citas.filter(c => {
        if (c.fecha < t || c.nss.slice(-4) !== pac.d4) return false;
        const nameWords = norm(c.nombre).split(/\s+/);
        return words.every(w => nameWords.some(n => n.startsWith(w)));
      }).sort((a, b) => (a.fecha + a.hora).localeCompare(b.fecha + b.hora));
      if (!found.length) { pac.err = "No encontramos su cita. Revise su nombre y los 4 números, o llame al consultorio."; return renderPatient(); }
      pac.err = ""; pac.found = found.map(c => c.id); pac.step = "cita"; renderPatient();
    });
  }

  // ---------- consultorio ----------
  let adm = { unlocked: false, tab: "agenda", day: today(), pasteText: "", pasteDay: today(), preview: null, msg: "" };
  try { adm.unlocked = sessionStorage.getItem(KEY + "-pin") === "ok"; } catch (e) {}
  const LABEL = { pendiente: "Sin avisar", camino: "En camino", no_va: "No va", llego: "Ya llegó" };

  function renderAdmin() {
    const exit = '<button class="link" type="button" id="to-pac">Ver como paciente</button>';
    if (!adm.unlocked) {
      app.innerHTML = topBar(exit) + '<main class="wrap lock"><div class="lead"><h1>Panel del consultorio</h1><p>Escriba el PIN para entrar.</p></div>' +
        '<form class="stack" id="f-pin"><div class="field"><label for="pin">PIN</label><input class="input digits" id="pin" inputmode="numeric" maxlength="4" type="password" autocomplete="off"></div>' +
        (adm.msg ? '<div class="err" role="alert">' + ic("alert") + '<span>' + adm.msg + '</span></div>' : '') +
        '<button class="btn-xl btn-blue" type="submit">Entrar</button><p class="tip">PIN de prueba: <b>1234</b></p></form></main>';
      on("to-pac", () => go("pac"));
      $("f-pin").addEventListener("submit", e => {
        e.preventDefault();
        if ($("pin").value === PIN) { adm.unlocked = true; adm.msg = ""; try { sessionStorage.setItem(KEY + "-pin", "ok"); } catch (x) {} }
        else adm.msg = "PIN incorrecto. Intente de nuevo.";
        renderAdmin();
      });
      return;
    }
    let h = topBar(exit) + '<main class="wrap wide admin"><nav class="nav" role="tablist">' +
      [["agenda", "Agenda"], ["pegar", "Cargar citas"], ["qr", "Cartel con QR"]].map(([k, l]) => '<button role="tab" type="button" data-tab="' + k + '" aria-selected="' + (adm.tab === k) + '">' + l + '</button>').join("") +
      '</nav>';
    h += adm.tab === "agenda" ? agendaHTML() : adm.tab === "pegar" ? pasteHTML() : qrHTML();
    h += '</main>';
    app.innerHTML = h;
    wireAdmin();
  }

  function agendaHTML() {
    const list = load().citas.filter(c => c.fecha === adm.day).sort((a, b) => a.hora.localeCompare(b.hora));
    const n = { camino: 0, pendiente: 0, no_va: 0, llego: 0 };
    list.forEach(c => n[c.estado]++);
    const isToday = adm.day === today(), now = nowHHMM();
    let h = '<div class="bar"><div><h2>' + longDay(adm.day) + '</h2><span class="sub">' + (isToday ? "Hoy · " : "") + list.length + ' citas de ' + SLOTS.length + ' lugares</span></div>' +
      '<input class="date-in" type="date" id="day" value="' + adm.day + '" aria-label="Cambiar día"></div>';
    h += '<div class="stats">' + ["camino", "pendiente", "no_va", "llego"].map(k => '<div class="stat ' + k + '"><b>' + n[k] + '</b><span>' + LABEL[k] + '</span></div>').join("") + '</div>';
    h += '<div class="list" aria-live="polite">';
    if (!list.length) h += '<div class="empty">No hay citas este día. Use <b>Cargar citas</b> para agregarlas.</div>';
    list.forEach((c, i) => {
      const late = isToday && c.estado === "pendiente" && c.hora < now;
      const next = list[i + 1];
      const current = isToday && c.hora <= now && (!next || next.hora > now);
      const tag = late ? '<span class="tag late">Ya es su hora · sin aviso</span>'
        : '<span class="tag ' + c.estado + '">' + LABEL[c.estado] + (c.avisoEn && c.estado !== "pendiente" ? " · " + clock(c.avisoEn) : "") + '</span>';
      const btn = c.estado === "llego"
        ? '<button class="sbtn ghost" type="button" data-undo="' + esc(c.id) + '">Deshacer</button>'
        : '<button class="sbtn fill" type="button" data-llego="' + esc(c.id) + '">Llegó</button>';
      h += '<div class="row ' + c.estado + (current ? " now" : "") + '"><span class="hr">' + c.hora + '</span>' +
        '<div style="min-width:0"><div class="name">' + esc(c.nombre) + '</div><div class="meta">NSS ••••' + esc(c.nss.slice(-4)) + '</div></div>' +
        '<div class="right">' + tag + btn + '</div></div>';
    });
    h += '</div><div class="row-btns"><button class="mbtn line" type="button" id="reset">Restaurar citas de ejemplo</button></div>';
    return h;
  }

  function parseAgenda(text, defDay) {
    const out = [];
    text.split(/\r?\n/).forEach((raw, i) => {
      let s = raw.trim();
      if (!s) return;
      if (/nombre|paciente|afiliaci/i.test(s) && !/\d{4}/.test(s)) return; // encabezado
      let fecha = defDay, hora = null, nss = null, err = [];
      let m = s.match(/\b(\d{4})-(\d{1,2})-(\d{1,2})\b/);
      if (m) { fecha = m[1] + "-" + pad(+m[2]) + "-" + pad(+m[3]); s = s.replace(m[0], " "); }
      else if ((m = s.match(/\b(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})\b/))) {
        const y = m[3].length === 2 ? "20" + m[3] : m[3];
        fecha = y + "-" + pad(+m[2]) + "-" + pad(+m[1]); s = s.replace(m[0], " ");
      }
      if ((m = s.match(/\b(\d{1,2}):(\d{2})\s*(a\.?\s?m\.?|p\.?\s?m\.?)?/i))) {
        let h = +m[1]; const ap = (m[3] || "").toLowerCase().replace(/[\s.]/g, "");
        if (ap === "pm" && h < 12) h += 12; if (ap === "am" && h === 12) h = 0;
        hora = pad(h) + ":" + m[2]; s = s.replace(m[0], " ");
      }
      if ((m = s.match(/\d[\d\s-]{8,16}\d/))) {
        const d = m[0].replace(/\D/g, "");
        if (d.length >= 10 && d.length <= 11) { nss = d; s = s.replace(m[0], " "); }
      }
      const nombre = s.replace(/[\t,;|]+/g, " ").replace(/[^A-Za-zÁÉÍÓÚÜÑáéíóúüñ' ]/g, " ").replace(/\s+/g, " ").trim()
        .toLowerCase().replace(/(^|\s)(\S)/g, (a, b, c) => b + c.toUpperCase());
      if (!hora) err.push("falta la hora");
      if (!nombre) err.push("falta el nombre");
      if (!nss) err.push("falta el NSS");
      if (isNaN(fromYmd(fecha).getTime())) err.push("fecha inválida");
      out.push({ linea: i + 1, fecha, hora, nombre, nss, err });
    });
    // Si la lista no trae horas, se reparten solas en el horario, en el orden pegado
    if (out.length && !out.some(r => r.hora)) {
      out.forEach((r, i) => {
        r.err = r.err.filter(e => e !== "falta la hora");
        r.hora = SLOTS[i] || null;
        if (!r.hora) r.err.push("ya no cabe en el horario (máximo " + SLOTS.length + ")");
      });
    }
    return out;
  }

  const SAMPLE_PASTE = "Nombre\tNSS\nPEREZ GARCIA JUAN CARLOS\t12345678901\nRUIZ SOTO ANA LAURA\t98765432105\nVEGA LUNA PEDRO\t4567-89-0123-4\nCRUZ MORA ELENA\t31826704419\nLARA NUÑEZ OSCAR\t77896102583";

  function pasteHTML() {
    let h = '<section class="stack paste"><div class="bar"><div><h2>Cargar citas</h2><span class="sub">Copie la lista del sistema del IMSS o de Excel y péguela aquí.</span></div></div>' +
      '<p class="help">Cada renglón necesita <b>nombre</b> y <b>número de seguro social</b>. Si la lista no trae horas, se reparten solas de <b>8:00 a 2:00</b>, una cada 15 minutos (hasta ' + SLOTS.length + ' pacientes), en el orden de la lista.</p>' +
      '<div class="row-btns"><label for="pday" style="font-weight:700;font-size:17px">Fecha de las citas</label><input class="date-in" type="date" id="pday" value="' + adm.pasteDay + '">' +
      '<button class="mbtn line" type="button" id="fill-sample">Usar lista de ejemplo</button></div>' +
      '<textarea id="ptext" spellcheck="false" aria-label="Lista de citas" placeholder="PEREZ GARCIA JUAN    12345678901">' + esc(adm.pasteText) + '</textarea>' +
      '<div class="row-btns"><button class="mbtn" type="button" id="do-preview">Revisar lista</button></div>';
    if (adm.preview) {
      const ok = adm.preview.filter(r => !r.err.length);
      const bad = adm.preview.length - ok.length;
      h += '<p style="font-weight:700">' + ok.length + ' citas listas' + (bad ? ' · <span style="color:var(--error)">' + bad + ' con problemas (no se guardarán)</span>' : '') + '</p>' +
        '<div class="tbl"><table><thead><tr><th>Fecha</th><th>Hora</th><th>Nombre</th><th>NSS</th><th>Revisión</th></tr></thead><tbody>' +
        adm.preview.map(r => '<tr class="' + (r.err.length ? "bad" : "") + '"><td class="mono">' + esc(r.fecha) + '</td><td class="mono">' + esc(r.hora || "—") + '</td><td>' + esc(r.nombre || "—") + '</td><td class="mono">' + esc(r.nss || "—") + '</td><td>' + (r.err.length ? "Renglón " + r.linea + ": " + r.err.join(", ") : "Correcto") + '</td></tr>').join("") +
        '</tbody></table></div>' +
        '<div class="row-btns"><button class="mbtn orange" type="button" id="do-save"' + (ok.length ? "" : " disabled") + '>Guardar ' + ok.length + ' citas</button></div>';
    }
    if (adm.msg) h += '<p class="okmsg" role="status">' + adm.msg + '</p>';
    return h + '</section>';
  }

  function savePreview() {
    const db = load();
    const ok = adm.preview.filter(r => !r.err.length);
    const days = new Set(ok.map(r => r.fecha));
    const prev = new Map(db.citas.map(c => [c.id, c]));
    db.citas = db.citas.filter(c => !days.has(c.fecha));
    ok.forEach(r => {
      const id = r.fecha + "|" + r.hora + "|" + r.nss;
      const old = prev.get(id);
      db.citas.push({ id, fecha: r.fecha, hora: r.hora, nombre: r.nombre, nss: r.nss, estado: old ? old.estado : "pendiente", avisoEn: old ? old.avisoEn : null });
    });
    save(db);
    adm.preview = null; adm.pasteText = "";
    adm.day = [...days].sort()[0] || adm.day;
  }

  function qrHTML() {
    return '<section class="poster"><div><span class="eyebrow">' + CLINIC.doctor + ' · Consultorio 8</span><h2>¿Tiene cita? Avise si viene.</h2>' +
      '<ol><li>Apunte la cámara de su celular a este código.</li><li>Guarde la página para el día de su cita.</li><li>Busque su nombre y toque <b>Voy en camino</b> o <b>Ya no voy a ir</b>.</li></ol>' +
      '<p class="small">Ejemplo del cartel. En la versión real el código abre la página de sus pacientes.</p></div>' +
      '<div class="qrbox" id="qr" role="img" aria-label="Código QR de ejemplo"></div></section>';
  }

  function wireAdmin() {
    on("to-pac", () => go("pac"));
    app.querySelectorAll("[data-tab]").forEach(b => b.addEventListener("click", () => { adm.tab = b.dataset.tab; adm.msg = ""; renderAdmin(); }));
    const day = $("day");
    if (day) day.addEventListener("change", () => { if (day.value) { adm.day = day.value; renderAdmin(); } });
    app.querySelectorAll("[data-llego]").forEach(b => b.addEventListener("click", () => { setEstado(b.dataset.llego, "llego"); renderAdmin(); }));
    app.querySelectorAll("[data-undo]").forEach(b => b.addEventListener("click", () => { setEstado(b.dataset.undo, "pendiente"); renderAdmin(); }));
    on("reset", () => { save({ citas: sample() }); adm.day = today(); renderAdmin(); });
    const pt = $("ptext");
    if (pt) pt.addEventListener("input", () => { adm.pasteText = pt.value; });
    const pd = $("pday");
    if (pd) pd.addEventListener("change", () => { adm.pasteDay = pd.value || today(); });
    on("fill-sample", () => { adm.pasteText = SAMPLE_PASTE; adm.preview = null; adm.msg = ""; renderAdmin(); });
    on("do-preview", () => { adm.msg = ""; adm.preview = parseAgenda(adm.pasteText, adm.pasteDay); renderAdmin(); });
    on("do-save", () => { savePreview(); adm.tab = "agenda"; renderAdmin(); });
    const qr = $("qr");
    if (qr && window.QRCode) new QRCode(qr, { text: "https://areijond-bit.github.io/avisa-tu-cita/", width: 400, height: 400, colorDark: "#0F1B2D", colorLight: "#FFFFFF" });
  }

  // ---------- vistas ----------
  let view = location.hash === "#consultorio" ? "adm" : "pac";
  function go(v) { view = v; render(); window.scrollTo(0, 0); }
  function render() { view === "pac" ? renderPatient() : renderAdmin(); }
  // si el consultorio tiene otra pestaña abierta, se actualiza sola
  window.addEventListener("storage", e => { if (e.key === KEY && view === "adm") renderAdmin(); });
  setInterval(() => { if (view === "adm" && adm.tab === "agenda" && adm.unlocked) renderAdmin(); }, 60000);
  render();
})();
</script>
