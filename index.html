<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Avisa tu Cita</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;700;800&family=Atkinson+Hyperlegible+Mono:wght@500;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.0/dist/tesseract.min.js"></script>
<style>
/* Layout: encabezado blanco con línea azul; una columna angosta para el paciente con una sola acción por pantalla; el consultorio ve una lista por hora. Siempre fondo blanco. */
:root {
  --white: #FFFFFF;
  --ink: #0F1B2D;
  --muted: #4E5D75;
  --line: #DDE4EE;
  --soft: #F5F8FC;
  --blue: #1450A3;
  --blue-hover: #0F428A;
  --blue-tint: #EAF1FB;
  --orange: #E2650F;
  --orange-ink: #B24F0B;
  --orange-tint: #FFF1E6;
  --error: #B42318;
  --font: "Atkinson Hyperlegible Next", "Segoe UI", system-ui, sans-serif;
  --mono: "Atkinson Hyperlegible Mono", ui-monospace, Consolas, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { background: var(--white); }
body { background: var(--white); color: var(--ink); font-family: var(--font); font-size: 20px; line-height: 1.5; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--orange); outline-offset: 3px; }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { text-wrap: balance; line-height: 1.2; }
svg.i { width: 1em; height: 1em; flex: none; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

.wrap { width: 100%; max-width: 560px; margin: 0 auto; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
.wrap.wide { max-width: 1000px; }

/* encabezado */
.top { border-bottom: 4px solid var(--blue); background: var(--white); }
.top .wrap { display: flex; align-items: center; gap: 14px; padding-block: 16px; }
.mark { width: 48px; height: 48px; border-radius: 12px; background: var(--blue); display: grid; place-items: center; flex: none; }
.mark svg { width: 26px; height: 26px; }
.top .id { display: flex; flex-direction: column; min-width: 0; }
.top .doc { font-size: 22px; font-weight: 800; line-height: 1.2; }
.top .place { font-size: 16px; color: var(--muted); }
.top .right { margin-left: auto; }

main.wrap { padding-block: 28px 24px; display: flex; flex-direction: column; gap: 24px; }

/* botones grandes */
.btn-xl {
  display: flex; align-items: center; justify-content: center; gap: 14px;
  width: 100%; min-height: 80px; padding: 16px 24px; border-radius: 16px;
  font-size: 26px; font-weight: 800; letter-spacing: 0.005em; border: 3px solid transparent;
  transition: background-color .15s, transform .05s;
}
.btn-xl svg.i { width: 32px; height: 32px; stroke-width: 2.6; }
.btn-xl:active { transform: translateY(1px); }
.btn-blue { background: var(--blue); color: var(--white); }
.btn-blue:hover { background: var(--blue-hover); }
.btn-orange { background: var(--orange); color: var(--white); }
.btn-orange:hover { background: var(--orange-ink); }
.btn-orange-line { background: var(--white); color: var(--orange-ink); border-color: var(--orange); }
.btn-orange-line:hover { background: var(--orange-tint); }
.btn-plain { background: var(--white); color: var(--blue); border-color: var(--line); font-size: 22px; min-height: 64px; }
.btn-plain:hover { border-color: var(--blue); }

.lead { display: flex; flex-direction: column; gap: 10px; }
.lead h1 { font-size: 34px; font-weight: 800; }
.lead p { font-size: 21px; color: var(--muted); max-width: 32ch; }
.step { font-size: 16px; font-weight: 700; color: var(--orange-ink); letter-spacing: 0.06em; text-transform: uppercase; }

/* teléfono */
.phone { display: flex; align-items: center; gap: 16px; padding: 18px 20px; border: 2px solid var(--line); border-radius: 16px; }
.phone .ic { width: 52px; height: 52px; border-radius: 50%; background: var(--blue-tint); color: var(--blue); display: grid; place-items: center; flex: none; }
.phone .ic svg.i { width: 26px; height: 26px; }
.phone .txt { display: flex; flex-direction: column; min-width: 0; }
.phone .txt span { font-size: 17px; color: var(--muted); }
.phone a { font-family: var(--mono); font-size: 24px; font-weight: 700; color: var(--blue); text-decoration: none; user-select: all; }

/* formulario */
form.stack, .stack { display: flex; flex-direction: column; gap: 22px; }
.field { display: flex; flex-direction: column; gap: 8px; }
.field label { font-size: 22px; font-weight: 700; }
.field .help { font-size: 17px; color: var(--muted); margin-top: -4px; }
.input { width: 100%; min-height: 66px; padding: 12px 18px; font-size: 26px; border: 2px solid #B9C5D6; border-radius: 14px; background: var(--white); }
.input:focus { border-color: var(--blue); outline: 3px solid var(--blue-tint); outline-offset: 0; }
.input.digits { font-family: var(--mono); letter-spacing: 0.35em; max-width: 240px; }
.err { display: flex; gap: 10px; align-items: flex-start; color: var(--error); font-weight: 700; font-size: 19px; background: #FDECEA; border-radius: 12px; padding: 14px 16px; }
.tip { font-size: 16px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 14px; }

/* cita */
.appt { border: 2px solid var(--blue); border-radius: 18px; overflow: hidden; }
.appt .who { background: var(--blue); color: var(--white); padding: 14px 20px; font-size: 20px; font-weight: 700; }
.appt .body { padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.appt .line { display: flex; align-items: center; gap: 14px; }
.appt .line svg.i { width: 30px; height: 30px; color: var(--blue); }
.appt .date { font-size: 24px; font-weight: 700; }
.appt .time { font-size: 40px; white-space: nowrap; font-variant-numeric: tabular-nums; font-weight: 700; color: var(--blue); line-height: 1.1; }
.state { display: flex; align-items: center; gap: 10px; font-size: 19px; font-weight: 700; padding: 12px 16px; border-radius: 12px; }
.state svg.i { width: 24px; height: 24px; }
.state.camino { background: var(--blue-tint); color: var(--blue); }
.state.no_va { background: var(--orange-tint); color: var(--orange-ink); }
.state.llego { background: #E6F4EC; color: #1F7A45; }
.actions { display: flex; flex-direction: column; gap: 14px; }
.note { font-size: 18px; color: var(--muted); }

/* confirmación */
.done { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 16px; padding-block: 12px; }
.done .ok { width: 104px; height: 104px; border-radius: 50%; display: grid; place-items: center; }
.done .ok svg.i { width: 56px; height: 56px; stroke-width: 3; }
.done .ok.blue { background: var(--blue); color: var(--white); }
.done .ok.orange { background: var(--orange); color: var(--white); }
.done h1 { font-size: 34px; font-weight: 800; }
.done p { font-size: 22px; color: var(--muted); max-width: 26ch; }

.foot { border-top: 1px solid var(--line); margin-top: 8px; }
.foot .wrap { padding-block: 18px 28px; display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center; justify-content: space-between; font-size: 15px; color: var(--muted); }
.link { background: none; border: 0; padding: 4px 0; color: var(--blue); font-weight: 700; font-size: 15px; text-decoration: underline; text-underline-offset: 3px; }

/* ---------- consultorio ---------- */
.nav { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.nav button { background: none; border: 0; border-bottom: 3px solid transparent; margin-bottom: -1px; padding: 12px 16px; font-size: 17px; font-weight: 700; color: var(--muted); white-space: nowrap; }
.nav button[aria-selected="true"] { color: var(--blue); border-bottom-color: var(--orange); }
.admin { display: flex; flex-direction: column; gap: 22px; }
.bar { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; justify-content: space-between; }
.bar h2 { font-size: 26px; font-weight: 800; }
.bar .sub { font-size: 16px; color: var(--muted); }
.date-in { padding: 10px 12px; border: 2px solid var(--line); border-radius: 10px; font-size: 16px; background: var(--white); }

.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: 14px; }
.stat { padding: 14px 18px; display: flex; flex-direction: column; gap: 2px; border-left: 1px solid var(--line); }
.stat:first-child { border-left: 0; }
.stat b { font-family: var(--mono); font-size: 32px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat span { font-size: 15px; font-weight: 700; color: var(--muted); }
.stat.camino b { color: var(--blue); }
.stat.no_va b { color: var(--orange-ink); }
.stat.pendiente b { color: var(--muted); }
.stat.llego b { color: #1F7A45; }
@media (max-width: 600px) {
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .stat:nth-child(3) { border-left: 0; }
  .stat:nth-child(n+3) { border-top: 1px solid var(--line); }
}

.list { border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.row { display: grid; grid-template-columns: 72px minmax(0, 1fr) auto; gap: 4px 16px; align-items: center; padding: 14px 18px; border-top: 1px solid var(--line); font-size: 18px; }
.row:first-child { border-top: 0; }
.row.now { background: var(--soft); }
.row .hr { font-family: var(--mono); font-weight: 700; font-size: 19px; font-variant-numeric: tabular-nums; color: var(--blue); }
.row .name { font-weight: 700; overflow-wrap: anywhere; }
.row .meta { font-size: 15px; color: var(--muted); font-family: var(--mono); }
.row.no_va .name { text-decoration: line-through; text-decoration-color: var(--orange); color: var(--muted); }
.row .right { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: flex-end; }
.tag { display: inline-flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 700; padding: 6px 12px; border-radius: 999px; white-space: nowrap; }
.tag::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: currentColor; }
.tag.camino { background: var(--blue-tint); color: var(--blue); }
.tag.no_va { background: var(--orange-tint); color: var(--orange-ink); }
.tag.pendiente { background: var(--soft); color: var(--muted); }
.tag.llego { background: #1F8A4C; color: #FFFFFF; }
.sbtn[data-llego] { background: #1F8A4C; border-color: #1F8A4C; color: #FFFFFF; }
.sbtn[data-llego]:hover { background: #176B3A; }
.tag.late { background: var(--white); color: var(--orange-ink); box-shadow: inset 0 0 0 2px var(--orange); }
.sbtn { border: 2px solid var(--blue); background: var(--white); color: var(--blue); border-radius: 10px; padding: 7px 14px; font-size: 15px; font-weight: 700; }
.sbtn:hover { background: var(--blue-tint); }
.sbtn.fill { background: var(--blue); color: var(--white); }
.sbtn.fill:hover { background: var(--blue-hover); }
.sbtn.ghost { border-color: var(--line); color: var(--muted); }
@media (max-width: 600px) {
  .row { grid-template-columns: 60px minmax(0, 1fr); }
  .row .right { grid-column: 2; justify-content: flex-start; }
}
.empty { padding: 32px 18px; text-align: center; color: var(--muted); font-size: 18px; }

.paste textarea { width: 100%; min-height: 220px; padding: 14px; border: 2px solid var(--line); border-radius: 12px; font-family: var(--mono); font-size: 15px; line-height: 1.6; background: var(--white); }
.paste textarea:focus { border-color: var(--blue); outline: none; }
.paste .help { font-size: 17px; color: var(--muted); max-width: 70ch; }
.tbl { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; }
table { border-collapse: collapse; width: 100%; font-size: 16px; }
th, td { padding: 10px 14px; text-align: left; border-top: 1px solid var(--line); white-space: nowrap; }
th { border-top: 0; background: var(--soft); font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
td.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
tr.bad td { color: var(--error); background: #FDECEA; }
.row-btns { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.mbtn { border: 0; border-radius: 12px; padding: 12px 22px; font-size: 17px; font-weight: 700; background: var(--blue); color: var(--white); }
.mbtn:hover { background: var(--blue-hover); }
.mbtn.orange { background: var(--orange); }
.mbtn.orange:hover { background: var(--orange-ink); }
.mbtn.line { background: var(--white); color: var(--blue); border: 2px solid var(--line); }
.mbtn:disabled { opacity: .45; cursor: not-allowed; }
.okmsg { color: var(--blue); font-weight: 700; }

.poster { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 32px; align-items: center; border: 2px solid var(--blue); border-radius: 18px; padding: 32px; }
.poster .eyebrow { color: var(--orange-ink); font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; font-size: 15px; }
.poster h2 { font-size: 36px; font-weight: 800; color: var(--blue); margin-top: 6px; }
.poster ol { margin: 18px 0 0; padding-left: 26px; font-size: 20px; display: flex; flex-direction: column; gap: 6px; }
.poster .small { font-size: 15px; color: var(--muted); margin-top: 18px; }
.qrbox { padding: 14px; border: 2px solid var(--line); border-radius: 14px; background: var(--white); }
.qrbox img, .qrbox canvas { display: block; width: 200px; height: 200px; }
@media (max-width: 600px) { .poster { grid-template-columns: 1fr; padding: 22px; } }

.lock { max-width: 420px; }

/* cargar citas por foto */
.pick { display: flex; flex-direction: column; gap: 12px; align-items: flex-start; }
.pick .btn-xl { max-width: 460px; cursor: pointer; }
.ocr { border: 2px solid var(--line); border-radius: 14px; padding: 16px 18px; }
.prog { height: 12px; background: var(--blue-tint); border-radius: 99px; overflow: hidden; margin-top: 10px; }
.prog span { display: block; height: 100%; background: var(--blue); transition: width .3s; }
.notice { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: 12px; font-size: 18px; }
.notice svg.i { width: 24px; height: 24px; margin-top: 2px; }
.notice.ok { background: var(--blue-tint); color: var(--blue); }
.notice.warn { background: var(--orange-tint); color: var(--orange-ink); border: 2px solid var(--orange); }
ol.edit { list-style: none; margin: 0; padding: 0; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.erow { display: grid; grid-template-columns: 32px 64px minmax(0, 1fr) 44px; gap: 10px; align-items: center; padding: 8px 12px; border-top: 1px solid var(--line); }
.erow:first-child { border-top: 0; }
.erow .num { font-family: var(--mono); color: var(--muted); font-weight: 700; text-align: right; }
.erow .ehr { font-family: var(--mono); color: var(--blue); font-weight: 700; font-size: 16px; }
.erow.over { background: var(--orange-tint); }
.erow.over .ehr { color: var(--orange-ink); font-family: var(--font); font-size: 14px; }
.ein { width: 100%; min-height: 46px; padding: 8px 12px; border: 2px solid var(--line); border-radius: 10px; font-size: 18px; background: var(--white); }
.ein:focus { border-color: var(--blue); outline: none; }
.ein.missing { border-color: var(--orange); background: var(--orange-tint); }
.del { width: 44px; height: 44px; border: 0; background: none; color: var(--muted); font-size: 28px; line-height: 1; border-radius: 10px; }
.del:hover { background: var(--orange-tint); color: var(--orange-ink); }
@media (max-width: 600px) { .erow { grid-template-columns: 26px 52px minmax(0, 1fr) 40px; gap: 8px; padding: 8px; } .erow .ehr { font-size: 14px; } }

/* cargar: foto o pegar */
.pick2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; max-width: 760px; }
.pick2 .btn-xl { cursor: pointer; font-size: 22px; }
@media (max-width: 600px) { .pick2 { grid-template-columns: 1fr; } }
.pastebox { display: flex; flex-direction: column; gap: 10px; border: 2px dashed var(--blue); border-radius: 14px; padding: 16px; background: var(--blue-tint); }
.pastebox textarea { background: var(--white); min-height: 160px; }
/* renglones editables con hora */
.erow { grid-template-columns: 32px 108px minmax(0, 1fr) auto; align-items: start; }
.erow .num { padding-top: 12px; }
.hsel { min-height: 46px; padding: 6px 8px; border: 2px solid var(--line); border-radius: 10px; font-family: var(--mono); font-weight: 700; font-size: 17px; color: var(--blue); background: var(--white); width: 100%; }
.hsel.missing { border-color: var(--orange); background: var(--orange-tint); }
.erow.clash { background: #FDECEA; }
.erow.clash .hsel { border-color: var(--error); color: var(--error); background: var(--white); }
.erow.clash .eprob { color: var(--error); }
.ecol { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.emeta { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; font-size: 14px; }
.eprob { color: var(--orange-ink); font-weight: 700; }
.known { display: inline-flex; gap: 4px; align-items: center; color: var(--muted); }
.known svg.i { width: 14px; height: 14px; color: var(--blue); }
.known.new { color: var(--blue); font-weight: 700; }
.who-pick { padding: 6px 8px; border: 2px solid var(--line); border-radius: 8px; font-size: 15px; background: var(--white); max-width: 100%; }
.who-pick.missing { border-color: var(--orange); background: var(--orange-tint); }
.eacts { display: flex; align-items: center; gap: 2px; }
.mini-link { background: none; border: 0; color: var(--blue); font-weight: 700; font-size: 14px; padding: 8px 6px; text-decoration: underline; text-underline-offset: 3px; }
.red { color: var(--error); }
@media (max-width: 600px) {
  .erow { grid-template-columns: 24px 92px minmax(0, 1fr); }
  .erow .ecol { grid-column: 1 / -1; }
  .erow .eacts { grid-column: 3; grid-row: 1; justify-content: flex-end; }
}
/* agenda: teléfonos y WhatsApp */
.numtag { color: var(--orange-ink); font-weight: 800; }
.row .meta { font-family: var(--font); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.telbtn { display: inline-flex; gap: 6px; align-items: center; background: none; border: 0; padding: 2px 0; color: var(--muted); font-size: 15px; font-family: var(--mono); }
.telbtn svg.i { width: 15px; height: 15px; }
.telbtn.add { color: var(--blue); font-family: var(--font); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }
.sent { display: inline-flex; gap: 3px; align-items: center; color: var(--blue); font-size: 14px; font-weight: 700; }
.sent svg.i { width: 14px; height: 14px; }
.mbtn.wa, .sbtn.wa { background: #1F8A4C; color: #fff; border-color: #1F8A4C; display: inline-flex; gap: 8px; align-items: center; text-decoration: none; }
.mbtn.wa:hover, .sbtn.wa:hover { background: #176B3A; }
.sbtn.wa { padding: 7px 10px; }
.sbtn.wa svg.i, .mbtn.wa svg.i { width: 18px; height: 18px; }
.sendbar { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
.send { position: sticky; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); z-index: 25; display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; justify-content: space-between; border: 2px solid #1F8A4C; border-radius: 16px; padding: 14px 18px; background: #EAF6EF; box-shadow: 0 10px 30px rgba(15, 27, 45, .18); }
.send-info { display: flex; flex-direction: column; min-width: 0; flex: 1 1 220px; }
.send-prog { height: 8px; background: #CFE9D9; border-radius: 99px; overflow: hidden; margin-top: 8px; max-width: 320px; }
.send-prog span { display: block; height: 100%; background: #1F8A4C; transition: width .3s; }
.send-btns { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.mbtn.wa.big { font-size: 20px; padding: 14px 26px; }
.send b { font-size: 20px; }
.telform { display: flex; flex-direction: column; gap: 8px; padding: 14px 18px; background: var(--soft); border-top: 1px solid var(--line); }
.telform label { font-weight: 700; }
.telform .ein { max-width: 220px; font-family: var(--mono); }
/* pacientes */
.prow { display: flex; justify-content: space-between; gap: 12px; align-items: center; padding: 12px 18px; border-top: 1px solid var(--line); }
.prow:first-child { border-top: 0; }
.prow .name { font-weight: 700; overflow-wrap: anywhere; }
.prow .meta { display: flex; gap: 6px; align-items: center; color: var(--muted); font-family: var(--mono); font-size: 15px; }
.prow .meta svg.i { width: 15px; height: 15px; }
.nophone { font-family: var(--font); color: var(--orange-ink); font-weight: 700; }
.pform { display: flex; flex-direction: column; gap: 12px; padding: 16px 18px; background: var(--soft); border: 2px solid var(--blue); border-radius: 14px; margin: 8px; }
.pform .field label { font-size: 17px; }
.pform .ein { max-width: 420px; }
.link.danger { color: var(--error); }
#pq { max-width: 480px; }

/* calendario */

.menu-i { display: flex; align-items: center; gap: 10px; text-align: left; border: 0; background: none; padding: 11px 12px; border-radius: 10px; font-size: 16px; font-weight: 600; color: var(--ink); }

.dot.pendiente { background: var(--muted); }
.dot.no_va { background: var(--orange); }
.dot.llego { background: #1F8A4C; }
.libre { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 4px 6px; color: var(--muted); }
.libre span { font-style: italic; }
.addslot { border: 2px dashed var(--line); background: none; color: var(--blue); font-weight: 700; font-size: 15px; padding: 8px 14px; border-radius: 10px; }
.addslot:hover { border-color: var(--blue); background: var(--blue-tint); }
.addform { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

@media (max-width: 600px) {
  .slot { grid-template-columns: 62px minmax(0, 1fr); }
  .slot-time { font-size: 15px; }
  .ccard { grid-template-columns: auto minmax(0, 1fr); }

}

}

.dp-head b { font-size: 19px; }
.dp-nav { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--blue-tint); color: var(--blue); font-size: 22px; font-weight: 800; line-height: 1; }
.dp-nav:hover { background: var(--blue); color: var(--white); }
.dp-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; text-align: center; }
.dp-wd { font-size: 13px; font-weight: 800; color: var(--muted); padding: 4px 0; }

.dp-day:hover { background: var(--blue-tint); color: var(--blue); }
.dp-day.today { box-shadow: inset 0 0 0 2px var(--orange); color: var(--orange-ink); font-weight: 800; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

<script>
(function () {
  // ======== CONFIGURACIÓN ========
  const CONFIG = { url: "https://soijjnyeiziokkegzrmn.supabase.co", key: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNvaWpqbnllaXppb2trZWd6cm1uIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ4MDEzODgsImV4cCI6MjExMDM3NzM4OH0.Y_DJAtGIL3APekJzg0YfVDsfN-7_6Y0SM0xYYMAKmEA" };
  const CLINIC = { doctor: "Dr. Alejandro Alba", lugar: "Medicina Familiar · Consultorio 8", consultorio: "Consultorio 8" };
  const SITE_URL = "https://areijond-bit.github.io/avisa-tu-cita/";
  // Horario de consulta: de 8:00 a 14:00, una consulta cada 15 minutos (24 lugares)
  const HORARIO = { inicio: 8 * 60, fin: 14 * 60, cada: 15 };
  // Horas que se pueden escoger a mano (un poco antes y después del horario)
  const ELEGIBLES = { inicio: 7 * 60, fin: 16 * 60 };
  // ===============================

  const sb = window.supabase.createClient(CONFIG.url, CONFIG.key);
  const KEY = "avisa-cita-v5";
  const pad = n => String(n).padStart(2, "0");
  const hhmm = m => pad(Math.floor(m / 60)) + ":" + pad(m % 60);
  const SLOTS = [], HORAS = [];
  for (let m = HORARIO.inicio; m < HORARIO.fin; m += HORARIO.cada) SLOTS.push(hhmm(m));
  for (let m = ELEGIBLES.inicio; m < ELEGIBLES.fin; m += HORARIO.cada) HORAS.push(hhmm(m));

  // ---------- íconos ----------
  const ICON = {
    search: '<circle cx="11" cy="11" r="7.5"/><line x1="21" y1="21" x2="16.4" y2="16.4"/>',
    go: '<polygon points="3 11 21 3 13 21 11 13 3 11"/>',
    x: '<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>',
    check: '<polyline points="20 6 9 17 4 12"/>',
    back: '<line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>',
    cal: '<rect x="3" y="4.5" width="18" height="17" rx="2.5"/><line x1="16" y1="2.5" x2="16" y2="6.5"/><line x1="8" y1="2.5" x2="8" y2="6.5"/><line x1="3" y1="10" x2="21" y2="10"/>',
    clock: '<circle cx="12" cy="12" r="9.5"/><polyline points="12 7 12 12 15.5 14"/>',
    phone: '<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.9.6 2.8.7a2 2 0 0 1 1.7 2z"/>',
    chat: '<path d="M21 11.5a8.4 8.4 0 0 1-12.4 7.4L3 20.5l1.6-5.4A8.4 8.4 0 1 1 21 11.5z"/>',
    paste: '<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1"/><line x1="9" y1="10" x2="15" y2="10"/><line x1="9" y1="14" x2="15" y2="14"/>',
    camera: '<path d="M22 18.5a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-10a2 2 0 0 1 2-2h3.5l2-3h5l2 3H20a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/>',
    alert: '<circle cx="12" cy="12" r="9.5"/><line x1="12" y1="7.5" x2="12" y2="12.5"/><line x1="12" y1="16.5" x2="12" y2="16.5"/>',
    trash: '<polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>'
  };
  const ic = n => '<svg class="i" viewBox="0 0 24 24" aria-hidden="true">' + ICON[n] + '</svg>';
  const CROSS = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 3h5v6.5H21v5h-6.5V21h-5v-6.5H3v-5h6.5z" fill="#fff"/></svg>';

  // ---------- fechas y textos ----------
  const ymd = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  const fromYmd = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
  const today = () => ymd(new Date());
  const addDays = (s, n) => { const d = fromYmd(s); d.setDate(d.getDate() + n); return ymd(d); };
  const longDay = s => {
    const t = fromYmd(s).toLocaleDateString("es-MX", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
    return t.charAt(0).toUpperCase() + t.slice(1);
  };
  const ampm = h => { const [a, b] = h.split(":").map(Number); return (a % 12 === 0 ? 12 : a % 12) + ":" + pad(b) + " " + (a < 12 ? "a. m." : "p. m."); };
  const clock = iso => { const d = new Date(iso); return pad(d.getHours()) + ":" + pad(d.getMinutes()); };
  const nowHHMM = () => { const d = new Date(); return pad(d.getHours()) + ":" + pad(d.getMinutes()); };
  const norm = s => (s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/\s+/g, " ").trim();
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
  const titleCase = s => s.toLowerCase().replace(/(^|\s)(\S)/g, (a, b, c) => b + c.toUpperCase());
  const telDigits = t => (t || "").replace(/\D/g, "");
  const telShow = t => { const d = telDigits(t).slice(-10); return d.length === 10 ? d.slice(0, 2) + " " + d.slice(2, 6) + " " + d.slice(6) : t || ""; };
  const telWa = t => { const d = telDigits(t); return d.length === 10 ? "52" + d : d; };
  const numTag = p => p && p.dup > 1 ? ' <span class="numtag">(' + p.num + ')</span>' : '';

  // ---------- conexión ----------
  const rpc = async (fn, args) => { const { data, error } = await sb.rpc(fn, args); if (error) throw error; return data; };
  const clave = () => { try { return localStorage.getItem(KEY + "-clave") || ""; } catch (e) { return ""; } };
  async function staff(fn, args) {
    const r = await rpc(fn, Object.assign({ p_clave: clave() }, args || {}));
    if (!r || r.ok !== true) { salir(); throw new Error("clave"); }
    if (!/^(agenda_dia|pacientes_lista)$/.test(fn)) avisarCambio();
    return r;
  }

  // Aviso en vivo: cuando alguien cambia algo (doctor, asistente o un paciente),
  // las demás pantallas abiertas vuelven a cargar la agenda al instante.
  const canal = sb.channel("consultorio-alba", { config: { broadcast: { self: false } } });
  let alCambiar = () => {};
  canal.on("broadcast", { event: "cambio" }, () => alCambiar()).subscribe();
  function avisarCambio() { canal.send({ type: "broadcast", event: "cambio", payload: {} }).catch(() => {}); }
  function salir() { try { localStorage.removeItem(KEY + "-clave"); } catch (e) {} adm.unlocked = false; if (view === "adm") renderAdmin(); }

  const app = document.getElementById("app");
  const $ = id => document.getElementById(id);
  const on = (id, fn) => { const el = $(id); if (el) el.addEventListener("click", fn); };
  const busy = () => app.querySelectorAll("button").forEach(b => { b.disabled = true; });
  const NET = "No se pudo conectar. Revise su internet e intente de nuevo.";
  const errBox = msg => msg ? '<div class="err" role="alert">' + ic("alert") + '<span>' + msg + '</span></div>' : '';

  function topBar(right) {
    return '<header class="top"><div class="wrap' + (view === "adm" ? " wide" : "") + '"><div class="mark">' + CROSS + '</div>' +
      '<div class="id"><span class="doc">' + CLINIC.doctor + '</span><span class="place">' + CLINIC.lugar + '</span></div>' +
      (right ? '<div class="right">' + right + '</div>' : '') + '</div></header>';
  }

  // =================== PACIENTE ===================
  const fresh = () => ({ step: "inicio", q: "", found: [], sel: null, err: "", link: false });
  let pac = fresh();
  const fixCita = r => ({ id: r.id, fecha: r.fecha, hora: String(r.hora).slice(0, 5), nombre: r.nombre, estado: r.estado });

  function renderPatient() {
    let h = topBar("") + '<main class="wrap">';
    const sel = pac.found.find(c => c.id === pac.sel);
    if (pac.step === "cargando") {
      h += '<div class="lead"><h1>Buscando su cita…</h1></div>';
    } else if (pac.step === "inicio") {
      h += '<div class="lead"><h1>¿Va a venir a su cita?</h1><p>Confirme o cancele su cita con el doctor.</p></div>' + errBox(pac.err) +
        '<button class="btn-xl btn-blue" id="go-search" type="button">' + ic("search") + 'Buscar mi cita</button>';
    } else if (pac.step === "buscar") {
      h += '<div class="lead"><span class="step">Paso 1 de 2</span><h1>Buscar mi cita</h1></div>' +
        '<form class="stack" id="f-search" novalidate>' +
        '<div class="field"><label for="q">Su nombre y apellido</label><span class="help">Como aparece en su carnet</span>' +
        '<input class="input" id="q" autocomplete="name" autocapitalize="words" value="' + esc(pac.q) + '"></div>' +
        errBox(pac.err) +
        '<button class="btn-xl btn-blue" type="submit">' + ic("search") + 'Buscar</button>' +
        '<button class="btn-xl btn-plain" type="button" id="back">' + ic("back") + 'Regresar</button></form>';
    } else if (pac.step === "cita") {
      h += '<div class="lead">' + (pac.link ? '' : '<span class="step">Paso 2 de 2</span>') + '<h1>' + (pac.found.length > 1 ? "Sus citas" : "Su cita") + '</h1></div>' + errBox(pac.err);
      pac.found.forEach(c => {
        h += '<section class="appt"><div class="who">' + esc(c.nombre) + '</div><div class="body">' +
          '<div class="line">' + ic("cal") + '<span class="date">' + longDay(c.fecha) + '</span></div>' +
          '<div class="line">' + ic("clock") + '<span class="time">' + ampm(c.hora) + '</span></div>';
        if (c.estado === "camino") h += '<div class="state camino">' + ic("check") + 'Su cita está confirmada</div>';
        if (c.estado === "no_va") h += '<div class="state no_va">' + ic("x") + 'Su cita está cancelada</div>';
        if (c.estado === "llego") h += '<div class="state llego">' + ic("check") + 'Su cita ya fue atendida</div>';
        h += '</div></section>';
        if (c.estado !== "llego") {
          h += '<div class="actions">';
          if (c.estado !== "camino") h += '<button class="btn-xl btn-blue" type="button" data-camino="' + esc(c.id) + '">' + ic("go") + 'Confirmar mi cita</button>';
          if (c.estado !== "no_va") h += '<button class="btn-xl btn-orange-line" type="button" data-nova="' + esc(c.id) + '">' + ic("x") + 'Cancelar mi cita</button>';
          h += '</div>';
        }
      });
      if (!pac.link) h += '<button class="btn-xl btn-plain" type="button" id="restart">' + ic("back") + 'Salir</button>';
    } else if (pac.step === "confirmar_no") {
      h += '<div class="lead"><h1>¿Seguro que quiere cancelar su cita?</h1><p>Su cita del ' + longDay(sel.fecha).toLowerCase() + ' a las ' + ampm(sel.hora) + ' se le dará a otro paciente.</p></div>' +
        errBox(pac.err) +
        '<div class="actions"><button class="btn-xl btn-orange" type="button" id="yes-no">' + ic("check") + 'Sí, cancelar mi cita</button>' +
        '<button class="btn-xl btn-plain" type="button" id="cancel-no">' + ic("back") + 'No, regresar</button></div>';
    } else if (pac.step === "listo") {
      const camino = sel.estado === "camino";
      h += '<div class="done"><div class="ok ' + (camino ? "blue" : "orange") + '">' + ic("check") + '</div>' +
        '<h1>' + (camino ? 'Su cita está confirmada' : 'Su cita está cancelada') + '</h1>' +
        '<p>' + (camino ? "Le esperamos el " + longDay(sel.fecha).toLowerCase() + " a las " + ampm(sel.hora) + "." : "Gracias por avisar al doctor.") + '</p></div>' +
        '<button class="btn-xl btn-plain" type="button" id="restart">Terminar</button>';
    }
    app.innerHTML = h + '</main>';
    window.scrollTo(0, 0);
    wirePatient();
  }

  async function avisar(id, estado) {
    busy();
    try {
      const r = await rpc("avisar_cita", { p_id: id, p_estado: estado });
      if (!r) { pac.err = "Esta cita ya no se puede cambiar."; pac.step = "cita"; return renderPatient(); }
      pac.found.find(c => c.id === id).estado = r; pac.sel = id; pac.err = ""; pac.step = "listo";
      avisarCambio();
    } catch (e) { pac.err = NET; }
    renderPatient();
  }

  function wirePatient() {
    on("go-search", () => { pac.step = "buscar"; pac.err = ""; renderPatient(); $("q").focus(); });
    on("back", () => { pac = fresh(); renderPatient(); });
    on("restart", () => { pac = fresh(); history.replaceState(null, "", location.pathname); renderPatient(); });
    on("cancel-no", () => { pac.step = "cita"; pac.err = ""; renderPatient(); });
    on("yes-no", () => avisar(pac.sel, "no_va"));
    app.querySelectorAll("[data-camino]").forEach(b => b.addEventListener("click", () => avisar(b.dataset.camino, "camino")));
    app.querySelectorAll("[data-nova]").forEach(b => b.addEventListener("click", () => { pac.sel = b.dataset.nova; pac.err = ""; pac.step = "confirmar_no"; renderPatient(); }));
    const f = $("f-search");
    if (!f) return;
    f.addEventListener("submit", async e => {
      e.preventDefault();
      pac.q = $("q").value;
      if (norm(pac.q).split(" ").filter(w => w.length >= 2).length < 2) { pac.err = "Escriba su nombre y su apellido."; return renderPatient(); }
      busy();
      try {
        const found = (await rpc("buscar_cita", { p_nombre: pac.q })).map(fixCita);
        if (!found.length) { pac.err = "No encontramos su cita. Revise que su nombre y apellido estén bien escritos."; return renderPatient(); }
        pac.err = ""; pac.found = found; pac.step = "cita";
      } catch (x) { pac.err = NET; }
      renderPatient();
    });
  }

  // Link personal desde WhatsApp: ?c=<token>
  async function abrirLink(token) {
    pac.step = "cargando"; renderPatient();
    try {
      const found = (await rpc("cita_por_token", { p_token: token })).map(fixCita);
      if (found.length) { pac.found = found; pac.link = true; pac.step = "cita"; }
      else { pac.step = "inicio"; pac.err = "Este enlace ya no sirve. Busque su cita con su nombre."; }
    } catch (e) { pac.step = "inicio"; pac.err = NET; }
    renderPatient();
  }

  // =================== CONSULTORIO ===================
  let adm = {
    unlocked: false, tab: "agenda", day: today(), list: null, loadErr: "", msg: "",
    pasteText: "", pasteDay: addDays(today(), 1), rows: null, ocr: null, showPaste: false,
    pacientes: null, pq: "", pedit: null, editTel: null, envio: null
  };
  const LABEL = { pendiente: "No confirmado", camino: "Confirmado", no_va: "Cancelado", llego: "Atendido" };

  async function loadDay() {
    try { adm.list = (await staff("agenda_dia", { p_fecha: adm.day })).citas; adm.loadErr = ""; }
    catch (e) { if (e.message !== "clave") adm.loadErr = "No se pudo cargar la agenda. Revise el internet."; }
    const ocupado = adm.editTel || adm.editName || adm.reag || adm.addSlot || adm.menu || drag || dp.open;
    if (view === "adm" && adm.unlocked && adm.tab === "agenda" && !ocupado) renderAdmin();
  }
  async function loadPacientes() {
    try { adm.pacientes = (await staff("pacientes_lista")).pacientes; }
    catch (e) { if (e.message !== "clave") adm.msg = "No se pudo cargar la lista de pacientes."; }
    if (view === "adm" && adm.unlocked && (adm.tab === "pacientes" || adm.tab === "cargar")) renderAdmin();
  }

  function renderAdmin() {
    const right = adm.unlocked ? '<button class="link" type="button" id="logout">Salir</button>' : '';
    if (!adm.unlocked) {
      app.innerHTML = topBar(right) + '<main class="wrap lock"><div class="lead"><h1>Panel del consultorio</h1><p>Escriba la contraseña para entrar.</p></div>' +
        '<form class="stack" id="f-login"><div class="field"><label for="pass">Contraseña</label><input class="input digits" id="pass" inputmode="numeric" type="password" autocomplete="current-password"></div>' +
        errBox(adm.msg) + '<button class="btn-xl btn-blue" type="submit">Entrar</button></form></main>';
      $("f-login").addEventListener("submit", async e => {
        e.preventDefault(); busy();
        const pass = $("pass").value.trim();
        let good = false, fallo = "Contraseña incorrecta. Intente de nuevo.";
        try { good = (await rpc("entrar_consultorio", { p_clave: pass })) === true; }
        catch (x) { fallo = /intentos/i.test(x.message || "") ? "Demasiados intentos. Espere 15 minutos." : NET; }
        if (good) { try { localStorage.setItem(KEY + "-clave", pass); } catch (x) {} adm.unlocked = true; adm.msg = ""; startAdmin(); }
        else { adm.msg = fallo; renderAdmin(); }
      });
      return;
    }
    let h = topBar(right) + '<main class="wrap wide admin"><nav class="nav" role="tablist">' +
      [["agenda", "Agenda"], ["cargar", "Cargar citas"], ["pacientes", "Pacientes"], ["qr", "Cartel con QR"]]
        .map(([k, l]) => '<button role="tab" type="button" data-tab="' + k + '" aria-selected="' + (adm.tab === k) + '">' + l + '</button>').join("") + '</nav>';
    h += { agenda: agendaHTML, cargar: cargarHTML, pacientes: pacientesHTML, qr: qrHTML }[adm.tab]();
    app.innerHTML = h + '</main>';
    wireAdmin();
  }

  // ---------- Agenda + WhatsApp ----------
  const mensaje = c => "Hola, " + c.nombre + ". Le recordamos su cita con el " + CLINIC.doctor + " (" + CLINIC.consultorio + ") el " +
    longDay(c.fecha).toLowerCase() + " a las " + ampm(c.hora) + ".\n\n¿Va a venir? Toque aquí para confirmar o cancelar:\n" + SITE_URL + "?c=" + c.token;
  // En celular abre la app de WhatsApp; en computadora, WhatsApp Web siempre en la misma pestaña
  const esCelular = window.matchMedia("(pointer: coarse)").matches;
  const waLink = c => esCelular
    ? "https://wa.me/" + telWa(c.telefono) + "?text=" + encodeURIComponent(mensaje(c))
    : "https://web.whatsapp.com/send?phone=" + telWa(c.telefono) + "&text=" + encodeURIComponent(mensaje(c));
  const WA_TAB = "avisa-whatsapp";
  const porEnviar = () => (adm.list || []).filter(c => c.telefono && c.estado === "pendiente" && !c.enviado_en);

  function agendaHTML() {
    let h = '<div class="bar"><div><h2>' + longDay(adm.day) + '</h2><span class="sub">' + (adm.day === today() ? "Hoy · " : "") +
      (adm.list ? adm.list.length + ' citas' : 'Cargando…') + '</span></div>' +
      '<div class="row-btns"><button class="mbtn line" type="button" id="prev-day" aria-label="Día anterior">‹</button>' +
      datePicker("day", adm.day, "right") +
      '<button class="mbtn line" type="button" id="next-day" aria-label="Día siguiente">›</button></div></div>';
    if (adm.flash) h += '<div class="notice ok" role="status">' + ic("check") + '<span>' + adm.flash + '</span></div>';
    if (adm.loadErr) h += errBox(adm.loadErr);
    if (!adm.list) return h;
    const list = adm.list, n = { camino: 0, pendiente: 0, no_va: 0, llego: 0 };
    list.forEach(c => n[c.estado]++);
    h += '<div class="stats">' + ["camino", "pendiente", "no_va", "llego"].map(k => '<div class="stat ' + k + '"><b>' + n[k] + '</b><span>' + LABEL[k] + '</span></div>').join("") + '</div>';

    // Envío de WhatsApp, uno por uno
    if (adm.envio) {
      const q = adm.envio, c = list.find(x => x.id === q.ids[q.i]);
      if (c) {
        h += '<div class="send"><div class="send-info"><span class="sub">Mensaje ' + (q.i + 1) + ' de ' + q.ids.length + '</span><b>' + esc(c.nombre) + numTag(c) + '</b><span class="sub">' + telShow(c.telefono) + ' · ' + c.hora + '</span>' +
          '<div class="send-prog" aria-hidden="true"><span style="width:' + Math.round(q.i / q.ids.length * 100) + '%"></span></div></div>' +
          '<div class="send-btns"><a class="mbtn wa big" id="wa-go" href="' + esc(waLink(c)) + '" target="' + WA_TAB + '" rel="noopener">' + ic("chat") + 'Abrir WhatsApp</a>' +
          '<button class="mbtn line" type="button" id="wa-skip">Saltar</button><button class="link" type="button" id="wa-stop">Terminar</button></div></div>' +
          '<p class="help">Toque <b>Abrir WhatsApp</b>, dé enviar y regrese a esta pestaña: el siguiente paciente ya estará listo en el mismo botón.</p>';
      } else adm.envio = null;
    }
    if (!adm.envio) {
      const pend = porEnviar(), sinTel = list.filter(c => !c.telefono).length;
      h += '<div class="sendbar">' +
        (pend.length ? '<button class="mbtn wa" type="button" id="wa-all">' + ic("chat") + 'Enviar WhatsApp a todos (' + pend.length + ')</button>' : '<span class="sub">' + (list.length ? 'No hay mensajes pendientes por enviar.' : '') + '</span>') +
        (sinTel ? '<span class="sub">' + sinTel + (sinTel === 1 ? ' paciente no tiene' : ' pacientes no tienen') + ' teléfono.</span>' : '') + '</div>';
    }

    // Siempre se ven los 24 lugares del horario; las horas van en su propia columna
    const isToday = adm.day === today(), now = nowHHMM();
    const porHora = new Map(list.map(c => [c.hora, c]));
    const horas = [...new Set(SLOTS.concat(list.map(c => c.hora)))].sort();
    h += '<p class="help">Arrastre un nombre con <b>⠿</b> para cambiarlo de hora. Si la hora está ocupada, los dos se intercambian.</p>';
    h += '<div class="board" aria-live="polite">';
    horas.forEach((hr, i) => {
      const c = porHora.get(hr), next = horas[i + 1];
      const current = isToday && hr <= now && (!next || next > now);
      h += '<div class="slot' + (current ? ' now' : '') + (SLOTS.includes(hr) ? '' : ' extra') + '" data-slot="' + hr + '">' +
        '<div class="slot-time">' + hr + '</div><div class="slot-body">' + (c ? citaCard(c, isToday && c.estado === "pendiente" && c.hora < now) : libreHTML(hr)) + '</div></div>';
    });
    return h + '</div>';
  }

  function citaCard(c, late) {
    const tag = late ? '<span class="tag late">No confirmado · ya es su hora</span>'
      : '<span class="tag ' + c.estado + '">' + LABEL[c.estado] + (c.aviso_en && c.estado !== "pendiente" ? " · " + clock(c.aviso_en) : "") + '</span>';
    const llego = c.estado === "llego"
      ? '<button class="sbtn ghost" type="button" data-undo="' + c.id + '">Deshacer</button>'
      : '<button class="sbtn att" type="button" data-llego="' + c.id + '">Atendido</button>';
    const tel = c.telefono
      ? '<button class="telbtn" type="button" data-tel="' + c.id + '">' + ic("phone") + telShow(c.telefono) + '</button>' + (c.enviado_en ? ' <span class="sent">' + ic("check") + 'enviado</span>' : '')
      : '<button class="telbtn add" type="button" data-tel="' + c.id + '">+ Agregar teléfono</button>';
    const wa = c.telefono ? '<a class="sbtn wa" href="' + esc(waLink(c)) + '" target="' + WA_TAB + '" rel="noopener" data-wa="' + c.id + '" aria-label="WhatsApp a ' + esc(c.nombre) + '">' + ic("chat") + '</a>' : '';
    let h = '<div class="ccard ' + c.estado + '" data-cid="' + c.id + '">' +
      '<button class="grip" type="button" data-grip="' + c.id + '" aria-label="Arrastrar a ' + esc(c.nombre) + ' a otra hora">⠿</button>' +
      '<div class="cmain"><div class="name">' + esc(c.nombre) + numTag(c) + '</div><div class="meta">' + tel + '</div></div>' +
      '<div class="right">' + tag + wa + llego +
      '<div class="menuwrap"><button class="dots" type="button" data-menu="' + c.id + '" aria-label="Más opciones" aria-expanded="' + (adm.menu === c.id) + '">⋮</button>' +
      (adm.menu === c.id ? menuHTML(c) : '') + '</div></div></div>';
    if (adm.editName === c.id) {
      h += '<form class="telform" id="f-name"><label for="name-in">Nombre del paciente</label>' +
        '<div class="row-btns"><input class="ein" id="name-in" value="' + esc(c.nombre) + '" autocapitalize="words" style="max-width:360px;font-family:var(--font)">' +
        '<button class="mbtn" type="submit">Guardar</button><button class="mbtn line" type="button" id="name-cancel">Cancelar</button></div>' +
        '<span class="sub">Se cambia también en Pacientes.</span></form>';
    }
    if (adm.editTel === c.id) {
      h += '<form class="telform" id="f-tel"><label for="tel-in">Teléfono de ' + esc(c.nombre) + '</label>' +
        '<div class="row-btns"><input class="ein" id="tel-in" type="tel" inputmode="tel" value="' + esc(telShow(c.telefono)) + '" placeholder="55 1234 5678">' +
        '<button class="mbtn" type="submit">Guardar</button><button class="mbtn line" type="button" id="tel-cancel">Cancelar</button></div>' +
        '<span class="sub">Se queda guardado para las próximas citas de este paciente.</span></form>';
    }
    if (adm.reag && adm.reag.id === c.id) h += reagHTML(c);
    return h;
  }

  // Reagendar: escoger otra fecha y una hora libre de ese día
  function reagHTML(c) {
    const r = adm.reag;
    const opts = !r.ocupadas ? '<option value="">Cargando horas…</option>'
      : '<option value="">Escoja la hora…</option>' + HORAS.map(x => {
          const ocup = r.ocupadas.has(x);
          return '<option value="' + x + '"' + (x === r.hora ? ' selected' : '') + (ocup ? ' disabled' : '') + '>' + x + (ocup ? ' · ocupada' : SLOTS.includes(x) ? '' : ' · fuera de horario') + '</option>';
        }).join("");
    const libres = r.ocupadas ? SLOTS.filter(s => !r.ocupadas.has(s)).length : null;
    return '<div class="telform reag"><b>Reagendar a ' + esc(c.nombre) + '</b>' +
      '<span class="sub">Ahora: ' + longDay(c.fecha) + ' a las ' + ampm(c.hora) + '</span>' +
      '<div class="row-btns"><span class="lbl">Nueva fecha</span>' + datePicker("reag", r.fecha, "left") + '</div>' +
      '<div class="row-btns"><label class="lbl" for="reag-h">Hora</label><select class="hsel" id="reag-h" style="max-width:220px"' + (r.ocupadas ? '' : ' disabled') + '>' + opts + '</select>' +
      (libres !== null ? '<span class="sub">' + libres + ' de ' + SLOTS.length + ' lugares libres ese día</span>' : '') + '</div>' +
      errBox(r.err) +
      '<div class="row-btns"><button class="mbtn" type="button" id="reag-ok"' + (r.hora ? '' : ' disabled') + '>Reagendar</button>' +
      '<button class="mbtn line" type="button" id="reag-cancel">Cancelar</button></div>' +
      '<span class="sub">Quedará como "No confirmado" para volver a mandarle el WhatsApp con la nueva fecha.</span></div>';
  }
  async function cargarOcupadas() {
    const r = adm.reag; if (!r) return;
    const fecha = r.fecha;
    try {
      const citas = (await staff("agenda_dia", { p_fecha: fecha })).citas;
      if (!adm.reag || adm.reag.fecha !== fecha) return;
      r.ocupadas = new Set(citas.filter(x => x.id !== r.id).map(x => x.hora));
      if (!r.hora || r.ocupadas.has(r.hora)) r.hora = SLOTS.find(s => !r.ocupadas.has(s)) || "";
    } catch (e) { r.err = "No se pudieron cargar las horas de ese día."; }
    renderAdmin();
  }

  function menuHTML(c) {
    if (adm.confirmQuitar === c.id) {
      return '<div class="menu" role="menu"><p class="menu-q">¿Quitar a ' + esc(c.nombre) + ' de esta hora?</p>' +
        '<button type="button" class="menu-i danger" data-act="quitar-si" data-id="' + c.id + '">Sí, quitar de la agenda</button>' +
        '<button type="button" class="menu-i" data-act="cerrar">No, dejarlo</button></div>';
    }
    const est = [["camino", "Confirmado"], ["pendiente", "No confirmado"], ["no_va", "Cancelado"], ["llego", "Atendido"]]
      .filter(([k]) => k !== c.estado)
      .map(([k, l]) => '<button type="button" class="menu-i" role="menuitem" data-act="estado" data-est="' + k + '" data-id="' + c.id + '"><span class="dot ' + k + '"></span>Marcar como ' + l.toLowerCase() + '</button>').join("");
    return '<div class="menu" role="menu">' +
      '<button type="button" class="menu-i" role="menuitem" data-act="nombre" data-id="' + c.id + '">Editar nombre</button>' +
      '<button type="button" class="menu-i" role="menuitem" data-act="tel" data-id="' + c.id + '">' + (c.telefono ? 'Cambiar teléfono' : 'Agregar teléfono') + '</button>' +
      '<button type="button" class="menu-i" role="menuitem" data-act="reag" data-id="' + c.id + '">' + ic("cal") + 'Reagendar para otra fecha</button>' +
      (!c.telefono ? "" : c.enviado_en
        ? '<button type="button" class="menu-i" role="menuitem" data-act="noenviado" data-id="' + c.id + '">' + ic("chat") + 'Marcar WhatsApp como no enviado</button>'
        : '<button type="button" class="menu-i" role="menuitem" data-act="enviado" data-id="' + c.id + '">' + ic("chat") + 'Marcar WhatsApp como enviado</button>') +
      '<div class="menu-sep"></div>' + est + '<div class="menu-sep"></div>' +
      '<button type="button" class="menu-i danger" role="menuitem" data-act="quitar" data-id="' + c.id + '">Quitar de la agenda</button></div>';
  }

  function libreHTML(hr) {
    if (adm.addSlot === hr) {
      return '<form class="addform" id="f-add"><input class="ein" id="add-in" placeholder="Nombre del paciente" autocapitalize="words" list="pac-names">' +
        '<datalist id="pac-names">' + (adm.pacientes || []).map(p => '<option value="' + esc(p.nombre) + '">').join("") + '</datalist>' +
        '<button class="mbtn" type="submit">Agregar</button><button class="mbtn line" type="button" id="add-cancel">Cancelar</button></form>';
    }
    return '<div class="libre"><span>Libre</span><button class="addslot" type="button" data-add="' + hr + '">+ Agregar paciente</button></div>';
  }

  // ---------- Cargar citas (foto o texto) ----------
  const pacPorNombre = () => {
    const m = new Map();
    (adm.pacientes || []).forEach(p => { const k = norm(p.nombre); if (!m.has(k)) m.set(k, []); m.get(k).push(p); });
    return m;
  };
  function choices(r) { return adm.pacientes ? (pacPorNombre().get(norm(r.nombre)) || []) : []; }
  function autoPid(r) {
    const m = choices(r);
    if (r.pid !== undefined && (r.pid === "nuevo" || m.some(p => p.id === r.pid))) return r.pid;
    return m.length === 1 ? m[0].id : m.length === 0 ? "nuevo" : "";
  }
  function choques() {
    const by = new Map();
    adm.rows.forEach((r, i) => { if (!r.hora) return; if (!by.has(r.hora)) by.set(r.hora, []); by.get(r.hora).push(i); });
    return by;
  }
  function rowProblem(r, i, by) {
    if (r.nombre.trim().length < 2) return "Falta el nombre.";
    if (!r.hora) return "Escoja una hora.";
    const otros = (by.get(r.hora) || []).filter(j => j !== i);
    if (otros.length) return "Misma hora que el número " + otros.map(j => j + 1).join(" y ") + ".";
    if (autoPid(r) === "") return "Hay varios pacientes con este nombre: escoja cuál.";
    return "";
  }

  function cargarHTML() {
    let h = '<section class="stack paste"><div class="bar"><div><h2>Cargar citas</h2><span class="sub">Tome una foto de la lista y revise los nombres y las horas.</span></div></div>' +
      '<div class="row-btns"><span style="font-weight:700;font-size:17px">Fecha de las citas</span>' + datePicker("pday", adm.pasteDay, "left") + '</div>';
    if (adm.ocr !== null) {
      h += '<div class="ocr"><b>Leyendo la lista…</b> <span class="sub">Puede tardar unos segundos.</span><div class="prog"><span style="width:' + Math.round(adm.ocr * 100) + '%"></span></div></div>';
    } else {
      h += '<div class="pick2"><label class="btn-xl btn-blue photo" for="foto">' + ic("camera") + (adm.rows ? 'Agregar otra foto' : 'Tomar o subir foto') + '</label>' +
        '<button class="btn-xl btn-plain" type="button" id="toggle-paste">' + ic("paste") + (adm.showPaste ? 'Ocultar pegar' : 'Pegar lista') + '</button></div>' +
        '<input id="foto" type="file" accept="image/*" hidden>' +
        (adm.rows ? '' : '<button class="link" type="button" id="empty-list">O escribir la lista a mano</button>');
      if (adm.showPaste) {
        h += '<div class="pastebox"><label for="ptext"><b>Pegue aquí la lista</b> <span class="sub">— texto copiado de Excel, WhatsApp o el sistema, o una imagen (captura de pantalla). En el celular: mantenga el dedo aquí y toque <b>Pegar</b>.</span></label>' +
          '<textarea id="ptext" spellcheck="false" placeholder="PEREZ GARCIA JUAN&#10;RUIZ SOTO ANA LAURA&#10;…">' + esc(adm.pasteText) + '</textarea>' +
          '<div class="row-btns"><button class="mbtn" type="button" id="do-preview">' + (adm.rows ? 'Agregar a la lista' : 'Leer lista') + '</button>' +
          '<span class="pcount" id="pcount" aria-live="polite"></span></div>' +
          '<span class="sub">Un nombre por renglón. También puede separarlos con comas.</span></div>';
      }
    }
    h += errBox(adm.msg);
    if (adm.rows) {
      h += '<div id="count" aria-live="polite">' + countHTML() + '</div>' +
        '<p class="help">Toque un nombre para corregirlo y la hora para cambiarla. Si la foto juntó dos nombres, use <b>Separar</b>.</p>' +
        '<ol class="edit">' + rowsHTML() + '</ol>' +
        '<div class="row-btns"><button class="mbtn line" type="button" id="add-row">+ Agregar paciente</button>' +
        '<button class="mbtn orange" type="button" id="do-save">Guardar citas</button></div>' +
        '<p class="help">Al guardar, los pacientes nuevos se agregan solos a <b>Pacientes</b>. Ahí les puede poner su teléfono.</p>';
    }
    return h + '</section>';
  }
  function rowsHTML() { const by = choques(); return adm.rows.map((r, i) => rowEdit(r, i, by)).join(""); }
  // Aviso (no bloquea): el mismo nombre aparece dos veces en la lista
  function repetido(r, i) {
    const k = norm(r.nombre); if (!k) return "";
    const otros = adm.rows.map((x, j) => j !== i && norm(x.nombre) === k ? j + 1 : 0).filter(Boolean);
    return otros.length ? '<span class="eprob">Nombre repetido en el número ' + otros.join(" y ") + '</span>' : "";
  }
  function rowEdit(r, i, by) {
    const prob = rowProblem(r, i, by), choque = /Misma hora/.test(prob);
    const opts = '<option value="">Hora…</option>' + HORAS.map(x => {
      const usado = (by.get(x) || []).filter(j => j !== i).length;
      return '<option value="' + x + '"' + (x === r.hora ? ' selected' : '') + '>' + x + (usado ? ' · ocupada' : '') + '</option>';
    }).join("");
    const m = choices(r), pid = autoPid(r);
    let quien = "";
    if (adm.pacientes && r.nombre.trim().length > 1) {
      if (m.length > 1) {
        quien = '<select class="who-pick' + (pid === "" ? ' missing' : '') + '" data-pick="' + i + '" aria-label="Cuál paciente">' +
          '<option value="">¿Cuál de ellos?</option>' +
          m.map(p => '<option value="' + p.id + '"' + (pid === p.id ? ' selected' : '') + '>' + esc(p.nombre) + ' (' + p.num + ') · ' + (p.telefono ? telShow(p.telefono) : 'sin teléfono') + '</option>').join("") +

  function primeraLibre() { const usadas = new Set(adm.rows.map(r => r.hora)); return SLOTS.find(s => !usadas.has(s)) || ""; }

  // Foto → texto, en el mismo celular (Tesseract)
  function prepImage(file) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, 2200 / Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
        const g = c.getContext("2d");
        g.filter = "grayscale(1) contrast(1.4)";
        g.drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(img.src);
        resolve(c);
      };
      img.onerror = reject;
      img.src = URL.createObjectURL(file);
    });
  }
  // Texto → nombres. Cada renglón es un nombre; una coma o punto y coma también separa.
  // De la foto se piden al menos dos palabras, para no colar texto suelto que se lee mal.
  function rowsFromText(text, foto) {
    return text.split(/\r?\n/)
      .map(l => l.replace(/^\s*\[[^\]]*\]\s*[^:]{1,40}:\s*/, " "))        // "[10:32, 15/11] Papá:" de WhatsApp
      .join("\n").split(foto ? /\r?\n/ : /\r?\n|[,;]/).map(l => l
        .replace(/^\s*(\d{1,3}\s*[.)\-:]?|[•·*\-–])\s*/, " ")                 // numeración y viñetas
        .replace(/\b\d{1,2}:\d{2}\s*(a\.?\s?m\.?|p\.?\s?m\.?)?/gi, " ")     // horas
        .replace(/[^A-Za-zÁÉÍÓÚÜÑáéíóúüñ' ]/g, " ")
        .replace(/\s+/g, " ").trim())
      .filter(l => l.length >= 2 &&
        (!foto || (l.split(" ").filter(w => w.length > 1).length >= 2 && l.length >= 5)) &&
        !/\b(nombre del paciente|nombres?|pacientes?|hora|fecha|lista|consultorio|folio|afiliaci\w*)$/i.test(l) &&
        (!foto || !/\b(nombre|paciente|hora|fecha|lista|consultorio|folio|afiliaci)/i.test(l)))
      .map(l => ({ nombre: titleCase(l), hora: "", pid: undefined }));
  }
  // Lo nuevo (foto o texto pegado) se agrega al final; las horas siguen en los lugares libres
  function agregarFilas(nuevas) {
    adm.rows = adm.rows || [];
    nuevas.forEach(r => { r.hora = primeraLibre(); adm.rows.push(r); });
    aviso();
  }
  async function leerFoto(file) {
    if (!window.Tesseract) { adm.msg = "No se pudo cargar el lector de fotos. Revise el internet."; return renderAdmin(); }
    adm.ocr = 0.02; adm.msg = ""; renderAdmin();
    try {
      const img = await prepImage(file);
      const worker = await Tesseract.createWorker("spa", 1, {
        logger: m => { if (m.status === "recognizing text") { adm.ocr = Math.max(0.05, m.progress); const s = app.querySelector(".prog span"); if (s) s.style.width = Math.round(adm.ocr * 100) + "%"; } }
      });
      const { data } = await worker.recognize(img);
      await worker.terminate();
      const rows = rowsFromText(data.text, true);
      if (rows.length) agregarFilas(rows);
      else adm.msg = "No se pudo leer ningún nombre. Tome la foto de frente, con buena luz, y que la lista llene toda la foto.";
    } catch (e) { adm.msg = "No se pudo leer la foto. Intente de nuevo."; }
    adm.ocr = null; renderAdmin();
  }

  function datePicker(id, value, side) {

  // ---------- Arrastrar nombres entre horas (mouse y dedo) ----------
  let drag = null;
  function wireDrag() {
    app.querySelectorAll("[data-grip]").forEach(g => {
      g.addEventListener("pointerdown", e => {
        if (e.button !== 0) return;
        e.preventDefault();
        const card = g.closest(".ccard"), r = card.getBoundingClientRect();
        drag = { id: g.dataset.grip, card, dy: e.clientY - r.top, x: r.left, w: r.width, started: false, y0: e.clientY, over: null };
        g.setPointerCapture(e.pointerId);
      });
      g.addEventListener("pointermove", e => {
        if (!drag) return;
        if (!drag.started) {
          if (Math.abs(e.clientY - drag.y0) < 5) return;
          drag.started = true;
          drag.ghost = drag.card.cloneNode(true);
          drag.ghost.classList.add("ghost");
          drag.ghost.style.width = drag.w + "px"; drag.ghost.style.left = drag.x + "px";
          document.body.appendChild(drag.ghost);
          drag.card.classList.add("dragging");
        }
        drag.ghost.style.top = (e.clientY - drag.dy) + "px";
        const el = document.elementFromPoint(e.clientX, e.clientY);
        const slot = el && el.closest(".slot");
        if (drag.over && drag.over !== slot) drag.over.classList.remove("over");
        if (slot) slot.classList.add("over");
        drag.over = slot;
        if (e.clientY < 70) window.scrollBy(0, -14); else if (e.clientY > innerHeight - 70) window.scrollBy(0, 14);
      });
      const fin = async () => {
        if (!drag) return;
        const d = drag; drag = null;
        if (!d.started) return;
        d.ghost.remove(); d.card.classList.remove("dragging");
        if (d.over) d.over.classList.remove("over");
        const c = adm.list.find(x => x.id === d.id), dest = d.over && d.over.dataset.slot;
        if (!c || !dest || dest === c.hora) return;
        const otro = adm.list.find(x => x.hora === dest);
        if (otro) otro.hora = c.hora;          // se ve el cambio de inmediato
        c.hora = dest;
        renderAdmin();
        try { await staff("mover_cita", { p_id: c.id, p_hora: dest }); } catch (e) {}
        loadDay();
      };
      g.addEventListener("pointerup", fin);
      g.addEventListener("pointercancel", fin);
    });
  }

      loadDay();
    }));
    app.querySelectorAll("[data-add]").forEach(b => b.addEventListener("click", () => {
      adm.addSlot = b.dataset.add; adm.msg = ""; renderAdmin(); const a = $("add-in"); if (a) a.focus();
      if (!adm.pacientes) loadPacientes();
    }));
    on("add-cancel", () => { adm.addSlot = null; renderAdmin(); });
    const fa = $("f-add");
    if (fa) fa.addEventListener("submit", async e => {
      e.preventDefault();
      const nombre = titleCase($("add-in").value.trim().replace(/\s+/g, " "));
      if (nombre.length < 2) return;
      busy();
      try {
        const r = await staff("agregar_cita", { p_fecha: adm.day, p_hora: adm.addSlot, p_nombre: nombre });
        adm.flash = r.error ? "" : (nombre + " quedó a las " + adm.addSlot + "." + (r.nuevo ? " Se agregó a Pacientes." : ""));
        adm.loadErr = r.error || "";
      } catch (x) {}
      adm.addSlot = null; adm.pacientes = null; loadDay();
    });
    on("name-cancel", () => { adm.editName = null; renderAdmin(); });
    const rh = $("reag-h");
    if (rh) rh.addEventListener("change", () => { adm.reag.hora = rh.value; adm.reag.err = ""; renderAdmin(); });
    on("reag-cancel", () => { adm.reag = null; renderAdmin(); });
    on("reag-ok", async () => {
      const r = adm.reag, c = adm.list.find(x => x.id === r.id);
      if (!r.hora) return;
      busy();
      try {
        const res = await staff("reagendar_cita", { p_id: r.id, p_fecha: r.fecha, p_hora: r.hora });
        if (res.error) { r.err = res.error; r.ocupadas = null; renderAdmin(); return cargarOcupadas(); }
        adm.flash = c.nombre + " se reagendó para el " + longDay(r.fecha).toLowerCase() + " a las " + ampm(r.hora) + " Ya puede mandarle el WhatsApp con la nueva fecha.";
      } catch (e) { r.err = NET; return renderAdmin(); }
      adm.reag = null; loadDay();
    });
    const fn = $("f-name");
    if (fn) fn.addEventListener("submit", async e => {
      e.preventDefault();
      const c = adm.list.find(x => x.id === adm.editName), nombre = titleCase($("name-in").value.trim().replace(/\s+/g, " "));
      if (!c || nombre.length < 2) return;
      busy();
      try { await staff("paciente_guardar", { p_id: c.paciente_id, p_nombre: nombre, p_telefono: c.telefono || "", p_cita: c.id }); } catch (x) {}
      adm.editName = null; adm.pacientes = null; loadDay();
    });
    const ft = $("f-tel");
    if (ft) ft.addEventListener("submit", async e => {
      e.preventDefault();
      const c = adm.list.find(x => x.id === adm.editTel); const tel = telDigits($("tel-in").value);
      if (tel && tel.length < 10) { alertTel(); return; }
      busy();
      try { await staff("paciente_guardar", { p_id: c.paciente_id, p_nombre: c.nombre, p_telefono: tel, p_cita: c.id }); } catch (x) {}
      adm.editTel = null; adm.pacientes = null; loadDay();
    });
    const marcarEnviado = id => { const c = adm.list.find(x => x.id === id); if (c) c.enviado_en = new Date().toISOString(); staff("marcar_enviado", { p_id: id }).catch(() => {}); };
    app.querySelectorAll("[data-wa]").forEach(a => a.addEventListener("click", () => { marcarEnviado(a.dataset.wa); setTimeout(renderAdmin, 300); }));
    on("wa-all", () => { adm.envio = { ids: porEnviar().map(c => c.id), i: 0, enviados: 0 }; adm.flash = ""; renderAdmin(); });
    const siguiente = () => {
      const q = adm.envio; q.i++;
      if (q.i >= q.ids.length) { adm.flash = "Listo: se enviaron " + q.enviados + (q.enviados === 1 ? " mensaje." : " mensajes."); adm.envio = null; }
      renderAdmin();
    };
    const go = $("wa-go");
    if (go) go.addEventListener("click", () => { marcarEnviado(adm.envio.ids[adm.envio.i]); adm.envio.enviados++; setTimeout(siguiente, 300); });
    on("wa-skip", siguiente);
    on("wa-stop", () => { adm.flash = adm.envio.enviados ? "Se enviaron " + adm.envio.enviados + (adm.envio.enviados === 1 ? " mensaje." : " mensajes.") : ""; adm.envio = null; renderAdmin(); });

    // cargar citas
    const pd = $("pday");
    if (pd) pd.addEventListener("change", () => { adm.pasteDay = pd.value || today(); });
    const foto = $("foto");
    if (foto) foto.addEventListener("change", () => { const f = foto.files && foto.files[0]; if (f) leerFoto(f); });
    on("toggle-paste", () => { adm.showPaste = !adm.showPaste; renderAdmin(); });
    on("empty-list", () => { adm.rows = [{ nombre: "", hora: SLOTS[0], pid: undefined }]; renderAdmin(); const el = app.querySelector(".ein.nm"); if (el) el.focus(); });
    const pt = $("ptext");
    const contar = () => { const n = rowsFromText(adm.pasteText).length, el = $("pcount"); if (el) el.textContent = n ? "Se detectaron " + n + (n === 1 ? " nombre" : " nombres") : ""; };
    if (pt) { pt.addEventListener("input", () => { adm.pasteText = pt.value; contar(); }); contar(); }
    on("do-preview", () => {
      const rows = rowsFromText(adm.pasteText);
      if (rows.length) { agregarFilas(rows); adm.msg = ""; adm.pasteText = ""; adm.showPaste = false; } else adm.msg = "No se encontró ningún nombre en el texto.";
      renderAdmin();
    });
    if (app.querySelector("ol.edit")) wireRows();
    on("add-row", () => {
      adm.rows.push({ nombre: "", hora: primeraLibre(), pid: undefined }); redrawRows();
      const all = app.querySelectorAll(".ein.nm"); if (all.length) all[all.length - 1].focus();
    });
    on("do-save", async () => {
      const rows = adm.rows.filter(r => r.nombre.trim());
      adm.rows = rows;
      const by = choques();
      if (!rows.length) { adm.msg = "La lista está vacía."; return renderAdmin(); }
      if (rows.some((r, i) => rowProblem(r, i, by))) { adm.msg = "Revise los renglones marcados antes de guardar."; return renderAdmin(); }
      busy();
      try {
        const res = await staff("guardar_citas", { p_citas: rows.map(r => {
          const pid = autoPid(r);
          return { fecha: adm.pasteDay, hora: r.hora, nombre: r.nombre.trim().replace(/\s+/g, " "), paciente_id: pid && pid !== "nuevo" ? pid : null, nuevo: pid === "nuevo" };
        }) });
        adm.flash = (res.citas === 1 ? "Se guardó 1 cita." : "Se guardaron " + res.citas + " citas.") +
          (res.nuevos ? " " + res.nuevos + (res.nuevos === 1 ? " paciente nuevo se agregó" : " pacientes nuevos se agregaron") + " a Pacientes." : "");
        adm.day = adm.pasteDay; adm.rows = null; adm.pasteText = ""; adm.showPaste = false; adm.pacientes = null;
        adm.tab = "agenda"; adm.list = null; adm.msg = "";
        renderAdmin(); loadDay();
      } catch (e) { if (e.message !== "clave") { adm.msg = "No se pudieron guardar las citas. Revise el internet e intente de nuevo."; renderAdmin(); } }
    });

    // pacientes
    const pq = $("pq");
    if (pq) pq.addEventListener("input", () => { adm.pq = pq.value; const pos = pq.selectionStart; renderAdmin(); const n = $("pq"); n.focus(); n.setSelectionRange(pos, pos); });
    on("p-new", () => { adm.pedit = { id: null, nombre: "", telefono: "" }; renderAdmin(); $("p-nombre").focus(); });
    app.querySelectorAll("[data-pedit]").forEach(b => b.addEventListener("click", () => {
      const p = adm.pacientes.find(x => x.id === b.dataset.pedit); adm.pedit = Object.assign({}, p); renderAdmin(); const t = $("p-tel"); if (t) t.focus();
    }));
    on("p-cancel", () => { adm.pedit = null; renderAdmin(); });
    on("p-del", () => { adm.pedit.confirmDel = true; renderAdmin(); });
    on("p-del-yes", async () => { busy(); try { await staff("paciente_borrar", { p_id: adm.pedit.id }); } catch (e) {} adm.pedit = null; loadPacientes(); });
    // borrar desde la lista: uno por uno o varios seleccionados
    app.querySelectorAll("[data-pdel]").forEach(b => b.addEventListener("click", () => { adm.pdel = b.dataset.pdel; adm.pedit = null; renderAdmin(); }));
    on("p-del-no", () => { adm.pdel = null; renderAdmin(); });
    app.querySelectorAll("[data-pdel-yes]").forEach(b => b.addEventListener("click", async () => {
      busy(); try { await staff("paciente_borrar", { p_id: b.dataset.pdelYes }); } catch (e) {}
      adm.psel.delete(b.dataset.pdelYes); adm.pdel = null; loadPacientes();
    }));
    app.querySelectorAll("[data-psel]").forEach(c => c.addEventListener("change", () => {
      c.checked ? adm.psel.add(c.dataset.psel) : adm.psel.delete(c.dataset.psel); adm.pbulk = false; renderAdmin();
    }));
    const pall = $("p-all");
    if (pall) pall.addEventListener("change", () => {
      const q = norm(adm.pq), vis = adm.pacientes.filter(p => !q || norm(p.nombre).includes(q));
      vis.forEach(p => pall.checked ? adm.psel.add(p.id) : adm.psel.delete(p.id)); adm.pbulk = false; renderAdmin();
    });
    on("p-clear", () => { adm.psel.clear(); adm.pbulk = false; renderAdmin(); });
    on("p-bulk", () => { adm.pbulk = true; renderAdmin(); });
    on("p-bulk-no", () => { adm.pbulk = false; renderAdmin(); });
    on("p-bulk-yes", async () => {
      busy();
      for (const id of [...adm.psel]) { try { await staff("paciente_borrar", { p_id: id }); } catch (e) { break; } }
      adm.psel.clear(); adm.pbulk = false; loadPacientes();
    });
    const fp = $("f-pac");
    if (fp) fp.addEventListener("submit", async e => {
      e.preventDefault();
      const nombre = $("p-nombre").value.trim(), tel = telDigits($("p-tel").value);
      if (nombre.length < 2) { adm.msg = "Escriba el nombre del paciente."; return renderAdmin(); }
      if (tel && tel.length < 10) { alertTel(); return; }
      busy();
      try { const r = await staff("paciente_guardar", { p_id: adm.pedit.id, p_nombre: titleCase(nombre), p_telefono: tel }); adm.msg = r.error || ""; } catch (x) {}
      adm.pedit = null; loadPacientes();
    });

    const qr = $("qr");
    if (qr && window.QRCode) new QRCode(qr, { text: SITE_URL, width: 400, height: 400, colorDark: "#0F1B2D", colorLight: "#FFFFFF" });
  }
  function alertTel() { adm.msg = "El teléfono debe tener 10 números."; renderAdmin(); }

  // Pegar una imagen (captura de pantalla) en "Cargar citas" la lee igual que una foto
  document.addEventListener("paste", e => {
    if (view !== "adm" || !adm.unlocked || adm.tab !== "cargar" || adm.ocr !== null) return;
    const img = [...(e.clipboardData?.items || [])].find(it => it.type.startsWith("image/"));
    if (img) { e.preventDefault(); leerFoto(img.getAsFile()); }
  });

  let listening = false;
  function startAdmin() {
    if (!listening) {
      const refrescar = () => {
        if (!adm.unlocked || view !== "adm") return;
        if (adm.tab === "agenda" && !adm.envio) loadDay();
        if (adm.tab === "pacientes") loadPacientes();
      };
      alCambiar = refrescar;                                   // al instante, cuando otra pantalla cambia algo
      setInterval(() => { if (!document.hidden) refrescar(); }, 15000);   // respaldo por si se pierde un aviso
      document.addEventListener("visibilitychange", () => { if (!document.hidden) refrescar(); });
      listening = true;
    }
    adm.list = null; renderAdmin(); loadDay();
  }

  // ---------- vistas ----------
  let view = location.hash === "#consultorio" ? "adm" : "pac";
  async function go(v) {
    view = v; window.scrollTo(0, 0);
    if (v === "pac") {
      const t = new URLSearchParams(location.search).get("c");
      return t && /^[0-9a-f-]{36}$/i.test(t) ? abrirLink(t) : renderPatient();
    }
    adm.unlocked = false;
    if (clave()) { try { adm.unlocked = (await rpc("entrar_consultorio", { p_clave: clave() })) === true; } catch (e) {} }
    adm.unlocked ? startAdmin() : renderAdmin();
  }
  window.addEventListener("hashchange", () => go(location.hash === "#consultorio" ? "adm" : "pac"));
  go(view);
})();
</script>

</body>
</html>
